<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

const SUPABASE_URL = "https://attneiceahozrxiiybis.supabase.co";
const SUPABASE_KEY = "sb_publishable_-771YtOZINM04l_x9YFd5g_J1dHL3TF";

const PLANS = [
  { id:"basic", name:"Basic", price:10, features:["Multi-user work orders","QuickBooks Online sync","Auto-email work orders","Custom service catalog"] },
  { id:"gps",   name:"+ GPS", price:19, features:["Everything in Basic","GPS truck tracking","Geofence auto-WO","Per-truck location history"] },
  { id:"pro",   name:"Service Pro", price:29, featured:true, features:["Everything in GPS","Price Levels for QBO included","Customer-tier pricing","Best value"] },
];

// Employees allowed per subscription plan (active members + pending invites)
const SEAT_LIMITS = { basic: 5, gps: 10, pro: 20 };

// Stripe LIVE payment links (real charges). To add/enable a plan: give it a live link here AND map its price_id -> plan in the stripe_prices table.
const STRIPE_LINKS = {
  basic: "https://buy.stripe.com/8x29AUgEt44f1ei0kQ8so02",
  gps:   "https://buy.stripe.com/28E5kE4VL44fbSWebG8so01",
  pro:   "https://buy.stripe.com/14A3cwag57grg9caZu8so03",
};
// Paste the Stripe Customer Portal link here to turn on the "Manage billing" button:
const STRIPE_PORTAL_URL = "";

// Plans sellable right now = those with a payment link configured.
const SELLABLE_PLANS = PLANS.filter(p => STRIPE_LINKS[p.id]);

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const fmt$ = n => "$" + (Number(n)||0).toFixed(2);
const today = () => new Date().toISOString().split("T")[0];

// ─── ROOT ────────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("loading");
  const [user, setUser] = useState(null);
  const [tenant, setTenant] = useState(null);
  const [userRole, setUserRole] = useState("tech");
  const [canInvoice, setCanInvoice] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) loadUser(session.user);
      else setView("landing");
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, session) => {
      if (session?.user) loadUser(session.user);
      else { setUser(null); setTenant(null); setView("landing"); }
    });
    return () => subscription.unsubscribe();
  }, []);

  const loadUser = async (authUser) => {
    setUser(authUser);
    const { data: tu } = await supabase.from("tenant_users")
      .select("*, tenants(*)")
      .eq("user_id", authUser.id).eq("active", true).maybeSingle();
    if (tu?.tenants) {
      setTenant(tu.tenants);
      setUserRole(tu.role || "tech");
      setCanInvoice(!!tu.can_invoice);
      setView("app");
      return;
    }
    // Check for pending invite by email
    const { data: invite } = await supabase.from("tenant_invites")
      .select("*, tenants(*)")
      .eq("email", authUser.email)
      .is("accepted_at", null)
      .maybeSingle();
    if (invite?.tenants) {
      // Accept invite: create tenant_users row, mark invite accepted
      await supabase.from("tenant_users").insert({
        tenant_id: invite.tenant_id,
        user_id: authUser.id,
        email: authUser.email,
        role: invite.role,
        can_invoice: invite.can_invoice,
        active: true,
      });
      await supabase.from("tenant_invites").update({ accepted_at: new Date().toISOString() }).eq("id", invite.id);
      setTenant(invite.tenants);
      setUserRole(invite.role);
      setCanInvoice(!!invite.can_invoice);
      setView("app");
      return;
    }
    // No tenant and no invite → setup wizard (new company)
    setView("wizard");
  };

  if (view === "loading") return <div className="auth-wrap"><div>Loading…</div></div>;
  if (view === "landing") return <Landing onSignup={()=>setView("signup")} onSignin={()=>setView("signin")} />;
  if (view === "signin")  return <SignIn onSwitchSignup={()=>setView("signup")} onBack={()=>setView("landing")} />;
  if (view === "signup")  return <SignUp onSwitchSignin={()=>setView("signin")} onBack={()=>setView("landing")} />;
  if (view === "wizard")  return <SetupWizard user={user} onComplete={(t)=>{setTenant(t);setView("app");}} />;
  if (view === "app")     return <WorkOrderApp user={user} tenant={tenant} userRole={userRole} canInvoice={canInvoice} />;
  return null;
}

// ─── LANDING ─────────────────────────────────────────────────────────────────
function Landing({ onSignup, onSignin }) {
  return (
    <div className="landing">
      <div className="landing-hero">
        <div className="landing-logo">AI Work Orders</div>
        <div className="landing-tag">By Prompted To Do This</div>
        <h1 className="landing-h1">Work orders that flow directly to QuickBooks.</h1>
        <p className="landing-sub">Stop double-entering data. Create work orders in the field, auto-sync to QuickBooks invoices, get paid faster.</p>
        <div className="landing-cta">
          <button className="btn btn-primary" onClick={onSignup}>Start Free 30-Day Trial</button>
          <button className="btn btn-ghost" onClick={onSignin}>Sign In</button>
        </div>
      </div>
    </div>
  );
}

// ─── AUTH FORMS ──────────────────────────────────────────────────────────────
function SignIn({ onSwitchSignup, onBack }) {
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const submit=async e=>{e.preventDefault();setErr("");setLoading(true);
    const {error}=await supabase.auth.signInWithPassword({email,password});
    if(error)setErr(error.message); setLoading(false);};
  return (
    <div className="auth-wrap"><div className="auth-card">
      <div className="auth-logo">AI Work Orders</div>
      <div className="auth-tag">By Prompted To Do This</div>
      <h2 className="auth-h2">Welcome back</h2>
      <p className="auth-sub">Sign in to your account</p>
      {err && <div className="alert alert-error">{err}</div>}
      <form onSubmit={submit}>
        <div className="fg"><label className="label">Email</label>
          <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus/></div>
        <div className="fg"><label className="label">Password</label>
          <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)} required/></div>
        <button type="submit" className="btn btn-primary btn-full" disabled={loading}>{loading?"Signing in…":"Sign In"}</button>
      </form>
      <div className="auth-foot">New here? <button className="btn-link" onClick={onSwitchSignup}>Create an account</button></div>
      <div className="auth-foot"><button className="btn-link" onClick={onBack}>← Back</button></div>
    </div></div>);
}

function SignUp({ onSwitchSignin, onBack }) {
  const [email,setEmail]=useState(""); const [password,setPassword]=useState("");
  const [err,setErr]=useState(""); const [success,setSuccess]=useState(false); const [loading,setLoading]=useState(false);
  const submit=async e=>{e.preventDefault();setErr("");setLoading(true);
    const {error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});
    if(error)setErr(error.message); else setSuccess(true); setLoading(false);};
  if(success) return (
    <div className="auth-wrap"><div className="auth-card">
      <div className="auth-logo">AI Work Orders</div>
      <div className="auth-tag">By Prompted To Do This</div>
      <div className="alert alert-success"><strong>Check your email!</strong> We sent a confirmation link to <strong>{email}</strong>. Click it to verify, then sign in.</div>
      <button className="btn btn-primary btn-full" onClick={onSwitchSignin}>Go to Sign In</button>
    </div></div>);
  return (
    <div className="auth-wrap"><div className="auth-card">
      <div className="auth-logo">AI Work Orders</div>
      <div className="auth-tag">By Prompted To Do This</div>
      <h2 className="auth-h2">Create your account</h2>
      <p className="auth-sub">Start your free 30-day trial. No credit card required.</p>
      {err && <div className="alert alert-error">{err}</div>}
      <form onSubmit={submit}>
        <div className="fg"><label className="label">Email</label>
          <input className="input" type="email" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus/></div>
        <div className="fg"><label className="label">Password (min 6 chars)</label>
          <input className="input" type="password" value={password} onChange={e=>setPassword(e.target.value)} required minLength={6}/></div>
        <button type="submit" className="btn btn-primary btn-full" disabled={loading}>{loading?"Creating account…":"Create Account & Start Trial"}</button>
      </form>
      <div className="auth-foot">Have an account? <button className="btn-link" onClick={onSwitchSignin}>Sign in</button></div>
      <div className="auth-foot"><button className="btn-link" onClick={onBack}>← Back</button></div>
    </div></div>);
}

// ─── SETUP WIZARD ────────────────────────────────────────────────────────────
function SetupWizard({ user, onComplete }) {
  const [step,setStep]=useState(1); const [companyName,setCompanyName]=useState("");
  const [phone,setPhone]=useState(""); const [industry,setIndustry]=useState("service");
  const [plan,setPlan]=useState((SELLABLE_PLANS[0]||PLANS[0]).id); const [err,setErr]=useState(""); const [loading,setLoading]=useState(false);
  const finish=async()=>{setErr("");setLoading(true);
    try{
      const {data:t,error:tErr}=await supabase.from("tenants").insert({name:companyName,owner_email:user.email,industry,phone,plan,trial_ends_at:new Date(Date.now()+30*24*60*60*1000).toISOString()}).select().single();
      if(tErr) throw tErr;
      const {error:tuErr}=await supabase.from("tenant_users").insert({tenant_id:t.id,user_id:user.id,email:user.email,role:"owner",can_invoice:true,active:true});
      if(tuErr) throw tuErr;
      onComplete(t);
    }catch(e){setErr(e.message);}
    setLoading(false);};
  const next=()=>{if(step===1&&!companyName.trim()){setErr("Company name is required");return;}setErr("");setStep(step+1);};
  return (
    <div className="auth-wrap"><div className="auth-card" style={{maxWidth:460}}>
      <div className="auth-logo">Welcome to AI Work Orders</div>
      <div className="auth-tag">Let's get you set up — 2 minutes</div>
      <div className="wizard-steps">
        <div className={`wizard-step ${step>=1?"active":""} ${step>1?"done":""}`}/>
        <div className={`wizard-step ${step>=2?"active":""} ${step>2?"done":""}`}/>
        <div className={`wizard-step ${step>=3?"active":""}`}/>
      </div>
      {err && <div className="alert alert-error">{err}</div>}
      {step===1 && <>
        <h2 className="auth-h2">Step 1: Your business</h2>
        <p className="auth-sub">Tell us about your company.</p>
        <div className="fg"><label className="label">Company Name</label>
          <input className="input" value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder="ACME Service, Inc." autoFocus/></div>
        <div className="fg"><label className="label">Phone</label>
          <input className="input" type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="(555) 555-5555"/></div>
        <div className="fg"><label className="label">Industry</label>
          <select className="input" value={industry} onChange={e=>setIndustry(e.target.value)}>
            <option value="service">General Service</option>
            <option value="tire">Tire / Wheel Service</option>
            <option value="hvac">HVAC</option>
            <option value="plumbing">Plumbing</option>
            <option value="electrical">Electrical</option>
            <option value="landscaping">Landscaping</option>
            <option value="pest">Pest Control</option>
            <option value="other">Other</option>
          </select></div>
        <button className="btn btn-primary btn-full" onClick={next}>Next →</button>
      </>}
      {step===2 && <>
        <h2 className="auth-h2">Step 2: Pick your plan</h2>
        <p className="auth-sub">All plans start with a 30-day free trial.</p>
        <div className="plan-grid">{SELLABLE_PLANS.map(p=>(
          <div key={p.id} className={`plan-card ${plan===p.id?"sel":""} ${p.featured?"featured":""}`} onClick={()=>setPlan(p.id)}>
            {p.featured && <span className="plan-badge">Most Popular</span>}
            <div className="plan-name">{p.name}</div>
            <div className="plan-price">${p.price}<span className="per">/mo</span></div>
            <div className="plan-features">{p.features.join(" • ")}</div>
          </div>))}</div>
        <button className="btn btn-primary btn-full" onClick={next}>Next →</button>
        <div className="auth-foot"><button className="btn-link" onClick={()=>setStep(1)}>← Back</button></div>
      </>}
      {step===3 && <>
        <h2 className="auth-h2">Step 3: Confirm</h2>
        <p className="auth-sub">Review and create your account.</p>
        <div style={{padding:14,marginBottom:14,background:"#fafaf6",border:"1px solid var(--line)",borderRadius:6}}>
          <div style={{fontSize:13,marginBottom:6}}><strong>Company:</strong> {companyName}</div>
          <div style={{fontSize:13,marginBottom:6}}><strong>Industry:</strong> {industry}</div>
          <div style={{fontSize:13,marginBottom:6}}><strong>Plan:</strong> {PLANS.find(p=>p.id===plan)?.name} — ${PLANS.find(p=>p.id===plan)?.price}/mo</div>
          <div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>30-day free trial. Cancel anytime.</div>
        </div>
        <button className="btn btn-primary btn-full" onClick={finish} disabled={loading}>{loading?"Setting up…":"Create my AI Work Orders account"}</button>
        <div className="auth-foot"><button className="btn-link" onClick={()=>setStep(2)}>← Back</button></div>
      </>}
    </div></div>);
}

// ═══════════════════════════════════════════════════════════════════════════
// WORK ORDER APP — three-step flow
// ═══════════════════════════════════════════════════════════════════════════
function WorkOrderApp({ user, tenant, userRole, canInvoice }) {
  const [step, setStep] = useState(1);
  const [workOrders, setWorkOrders] = useState([]);
  const [editingWO, setEditingWO] = useState(null);
  const [qboConnected, setQboConnected] = useState(false);
  const [loading, setLoading] = useState(true);
  const [showSettings, setShowSettings] = useState(false);
  const [settings, setSettings] = useState({ hide_rates_from_techs: false });

  const loadWOs = async () => {
    const { data } = await supabase.from("work_orders")
      .select("*").eq("tenant_id", tenant.id)
      .order("created_at", { ascending: false });
    setWorkOrders(data || []);
  };
  const loadQbo = async () => {
    const { data } = await supabase.from("qbo_tokens").select("tenant_id").eq("tenant_id", tenant.id).maybeSingle();
    setQboConnected(!!data);
  };
  const loadSettings = async () => {
    const { data } = await supabase.from("tenant_settings").select("*").eq("tenant_id", tenant.id).maybeSingle();
    if (data) setSettings(data);
  };

  useEffect(() => {
    Promise.all([loadWOs(), loadQbo(), loadSettings()]).then(() => setLoading(false));
  }, [tenant.id]);

  // Hide rates from techs if setting is on and user is a tech (not owner/admin)
  const hideRates = settings.hide_rates_from_techs && userRole === "tech";
  const isAdmin = userRole === "owner" || userRole === "admin";
  const isViewer = userRole === "viewer";
  const canCreate = !isViewer;                              // WO-only, WO+invoice, admin
  const mayInvoice = !isViewer && (isAdmin || canInvoice);  // WO+invoice or admin
  useEffect(() => {
    if (isViewer && ![2,3,6].includes(step)) setStep(2);
    else if (!isAdmin && (step === 4 || step === 7)) setStep(2);
    else if (!canCreate && (step === 1 || step === 5)) setStep(2);
  }, [step, isViewer, isAdmin, canCreate]);

  // Grace-banner gating: never blocks the app, just nudges when the trial has
  // ended and there's no active subscription.
  const subActive = ["active","trialing","past_due"].includes(tenant.subscription_status);
  const trialEndsAt = tenant.trial_ends_at ? new Date(tenant.trial_ends_at) : null;
  const trialEnded = trialEndsAt ? (trialEndsAt.getTime() < Date.now()) : false;
  const needsSub = !subActive && trialEnded;

  const openCount = workOrders.filter(w => w.status === "open").length;
  const signOut = async () => { await supabase.auth.signOut(); };
  const initials = (user.email[0] || "U").toUpperCase();

  return (
    <div className="app">
      <div className="topbar">
        <div className="topbar-left">
          <div className="topbar-logo">AI Work Orders <span style={{fontSize:9,opacity:0.55,fontWeight:400}}>v2·pricing</span></div>
          <div className="tenant-name">{tenant.name}</div>
        </div>
        <div className="topbar-right">
          <span className={`qb-chip ${qboConnected ? "" : "off"}`}>
            <span className="qb-dot"/>
            {qboConnected ? "QuickBooks Connected" : "QuickBooks Disconnected"}
          </span>
          <button className="btn-icon" onClick={()=>setShowSettings(true)} title="Settings">⚙</button>
          <div className="user-avatar">{initials}</div>
          <button className="btn-icon" onClick={signOut}>Sign out</button>
        </div>
      </div>

      {needsSub && (
        <div style={{background:"#fbeed8",borderBottom:"1px solid #e7c389",padding:"10px 16px",fontSize:13,textAlign:"center",color:"#7a4e12"}}>
          Your trial has ended — {isAdmin
            ? <button className="btn-text" onClick={()=>setShowSettings(true)} style={{color:"#7a4e12",fontWeight:700,textDecoration:"underline",padding:0}}>subscribe to keep AI Work Orders</button>
            : <span style={{fontWeight:600}}>ask your owner to subscribe.</span>}
        </div>
      )}

      {showSettings && (
        <Settings tenant={tenant} user={user} userRole={userRole} qboConnected={qboConnected}
          settings={settings}
          onClose={()=>setShowSettings(false)}
          onQboChange={loadQbo}
          onSettingsChange={loadSettings}/>
      )}

      <div className="main">
        <StepRibbon step={step} setStep={setStep} openCount={openCount} hasEditing={!!editingWO} canCreate={canCreate} isAdmin={isAdmin} />

        {step === 1 && canCreate && (
          <CreateWO
            tenant={tenant} user={user} hideRates={hideRates}
            onSaved={() => { loadWOs(); setStep(2); }}
          />
        )}

        {step === 2 && (
          <OpenList
            workOrders={workOrders} hideRates={hideRates}
            loading={loading}
            onPickInvoice={(wo) => { setEditingWO(wo); setStep(3); }}
            onCreateNew={() => setStep(1)}
            onEditInvoiced={(wo) => { setEditingWO(wo); setStep(5); }}
            onEditOpen={(wo) => { setEditingWO(wo); setStep(5); }}
            qboConnected={qboConnected}
            user={user}
            onReload={loadWOs}
            mayInvoice={mayInvoice}
            canCreate={canCreate}
            printerEmail={settings.printer_email || ""}
          />
        )}

        {step === 3 && (
          <InvoicePush
            wo={editingWO}
            qboConnected={qboConnected}
            user={user} hideRates={hideRates} userRole={userRole} mayInvoice={mayInvoice}
            onDone={() => { loadWOs(); setEditingWO(null); setStep(2); }}
            onBack={() => setStep(2)}
          />
        )}

        {step === 4 && isAdmin && <PriceBook tenant={tenant} />}
        {step === 6 && <Dashboard workOrders={workOrders} tenant={tenant} onOpenJobs={()=>setStep(2)} />}
        {step === 7 && isAdmin && <ImportCenter tenant={tenant} onDone={()=>setStep(4)} />}

        {step === 5 && canCreate && (
          <CreateWO
            tenant={tenant} user={user} hideRates={hideRates}
            editing={editingWO}
            onUpdated={(data) => { loadWOs(); setEditingWO(null); setStep(2); if (data && data.invoiceUrl) { try { window.open(data.invoiceUrl, "_blank"); } catch(e){} } }}
            onSaved={() => { loadWOs(); setStep(2); }}
          />
        )}
      </div>
    </div>
  );
}

// ─── STEP RIBBON ────────────────────────────────────────────────────────────
function StepRibbon({ step, setStep, openCount, hasEditing, canCreate, isAdmin }) {
  return (
    <div className="step-ribbon">
      <div className={`step-card s6 ${step===6?"active":""}`} onClick={()=>setStep(6)}>
        <div className="step-num">Home</div>
        <div className="step-title">Dashboard</div>
        <div className="step-meta">Jobs · revenue · techs</div>
      </div>
      {canCreate && (
      <div className={`step-card s1 ${step===1?"active":""}`} onClick={()=>setStep(1)}>
        <div className="step-num">Step 1</div>
        <div className="step-title">Create Work Order</div>
        <div className="step-meta">New WO — customer, technician, lines</div>
      </div>
      )}
      <div className={`step-card s2 ${step===2?"active":""}`} onClick={()=>setStep(2)}>
        <div className="step-num">Step 2</div>
        <div className="step-title">Open Work Orders</div>
        <div className="step-meta">Awaiting invoice</div>
        {openCount > 0 && <div className="step-pill">{openCount}</div>}
      </div>
      <div className={`step-card s3 ${step===3?"active":""}`}
        onClick={()=>{ if(hasEditing) setStep(3); }}
        style={{opacity: hasEditing ? 1 : 0.5, cursor: hasEditing ? "pointer" : "default"}}>
        <div className="step-num">Step 3</div>
        <div className="step-title">Create Invoice → QBO</div>
        <div className="step-meta">Push to QuickBooks</div>
      </div>
      {isAdmin && (
      <div className={`step-card ${step===4?"active":""}`} onClick={()=>setStep(4)}>
        <div className="step-num">Setup</div>
        <div className="step-title">Price Book</div>
        <div className="step-meta">Tiers · pricing</div>
      </div>
      )}
      {isAdmin && (
      <div className={`step-card s7 ${step===7?"active":""}`} onClick={()=>setStep(7)}>
        <div className="step-num">Setup</div>
        <div className="step-title">Import Center</div>
        <div className="step-meta">Products · price levels · customers</div>
      </div>
      )}
    </div>
  );
}

// ─── STEP 1: CREATE WORK ORDER ───────────────────────────────────────────────
function CreateWO({ tenant, user, hideRates, onSaved, editing, onUpdated }) {
  const newLine = () => ({ item: "", desc: "", qty: "", rate: 0 });
  const [date, setDate] = useState(editing?.date || today());
  const [customer, setCustomer] = useState(editing?.customer || "");
  const [technician, setTechnician] = useState(editing?.technician || "");
  const [lines, setLines] = useState(editing?.lines?.length ? editing.lines.map(l=>({...l})) : [newLine(), newLine()]);
  const [notes, setNotes] = useState(editing?.notes || "");
  const [poNumber, setPoNumber] = useState(editing?.po_number || "");
  const [docBusy, setDocBusy] = useState(false);
  const [docReview, setDocReview] = useState(null);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");

  // ── Price-level integration (autocomplete + auto-price when known) ──
  const [customers, setCustomers] = useState([]);
  const [priceLevels, setPriceLevels] = useState([]);
  const [catalog, setCatalog] = useState([]);
  const [customerId, setCustomerId] = useState(null);
  const [tierName, setTierName] = useState("");
  const [custOpen, setCustOpen] = useState(false);
  const [activeItem, setActiveItem] = useState(-1);

  useEffect(() => {
    (async () => {
      const [cu, pl, sc, qi, cs] = await Promise.all([
        supabase.from("customers").select("id,display_name,primary_price_level_id").eq("tenant_id", tenant.id).eq("active", true),
        supabase.from("price_levels").select("id,name,rank").eq("tenant_id", tenant.id).order("rank"),
        supabase.from("service_catalog").select("id,name,sku,default_rate").eq("tenant_id", tenant.id),
        supabase.from("qbo_items").select("id,name,sku,price").eq("tenant_id", tenant.id),
        supabase.from("custom_skus").select("id,name,sku,price").eq("tenant_id", tenant.id),
      ]);
      setCustomers(cu.data || []);
      setPriceLevels(pl.data || []);
      if (editing && editing.customer) {
        const ec = (cu.data||[]).find(x => (x.display_name||"").toLowerCase() === editing.customer.trim().toLowerCase());
        if (ec) { setCustomerId(ec.id); const et=(pl.data||[]).find(p=>p.id===ec.primary_price_level_id); setTierName(et?et.name:""); }
      }
      const cat = [];
      (sc.data||[]).forEach(x => cat.push({ source:"service", id:x.id, name:x.name, sku:x.sku, base:Number(x.default_rate)||0 }));
      (qi.data||[]).forEach(x => cat.push({ source:"qbo", id:x.id, name:x.name, sku:x.sku, base:Number(x.price)||0 }));
      (cs.data||[]).forEach(x => cat.push({ source:"custom", id:x.id, name:x.name, sku:x.sku, base:Number(x.price)||0 }));
      setCatalog(cat);
    })();
  }, [tenant.id]);

  const findCustomer = (name) => customers.find(c => (c.display_name||"").toLowerCase() === name.trim().toLowerCase());
  const findItem = (name) => { const q = name.trim().toLowerCase(); return catalog.find(x => (x.name||"").toLowerCase()===q || (x.sku||"").toLowerCase()===q); };
  const custMatches = (customer.trim() ? customers.filter(c => (c.display_name||"").toLowerCase().includes(customer.trim().toLowerCase())) : customers).slice(0, 8);
  const itemMatches = (val) => { const q = (val||"").trim().toLowerCase(); return (q ? catalog.filter(x => (x.name||"").toLowerCase().includes(q) || (x.sku||"").toLowerCase().includes(q)) : catalog).slice(0, 10); };

  const resolveRate = async (custId, src, itemId, base) => {
    if (custId && src && itemId) {
      const { data } = await supabase.rpc("fn_resolve_price", { p_customer_id: custId, p_item_source: src, p_item_id: itemId });
      if (data && data[0]) return Number(data[0].final_unit_price);
    }
    return base;
  };

  const onCustomerChange = (name) => {
    setCustomer(name);
    const c = findCustomer(name);
    const cid = c ? c.id : null;
    setCustomerId(cid);
    setTierName(c && c.primary_price_level_id ? ((priceLevels.find(p=>p.id===c.primary_price_level_id)||{}).name || "") : "");
    if (cid) {
      lines.forEach((l, i) => {
        if (l.item_source && l.item_id) {
          resolveRate(cid, l.item_source, l.item_id, l.base_rate!=null?l.base_rate:l.rate)
            .then(r => setLines(cur => cur.map((x, idx) => idx===i ? { ...x, rate: r } : x)));
        }
      });
    }
  };

  const onItemChange = async (i, name) => {
    const item = findItem(name);
    if (item) {
      const rate = await resolveRate(customerId, item.source, item.id, item.base);
      setLines(ls => ls.map((l,idx)=>idx===i ? { ...l, item:name, item_source:item.source, item_id:item.id, base_rate:item.base, rate } : l));
    } else {
      setLines(ls => ls.map((l,idx)=>idx===i ? { ...l, item:name, item_source:null, item_id:null } : l));
    }
  };

  const updateLine = (i, patch) => setLines(ls => ls.map((l,idx)=>idx===i?{...l,...patch}:l));
  const addLine = () => setLines(ls => [...ls, newLine()]);
  const delLine = (i) => setLines(ls => ls.length > 1 ? ls.filter((_,idx)=>idx!==i) : ls);
  const clearLines = () => setLines([newLine(), newLine()]);

  // ── PO / Estimate intake: AI reads the document, we match it to your customers
  //    and catalog, you review, THEN it fills the form. Nothing saves until you do.
  const normS = (x) => String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const toks = (x) => String(x||"").toLowerCase().split(/[^a-z0-9]+/).filter(t=>t.length>2);
  const sim = (a,b) => { const A=new Set(toks(a)), B=new Set(toks(b)); if(!A.size||!B.size) return 0; let hit=0; A.forEach(t=>{ if(B.has(t)) hit++; }); return hit/Math.max(A.size,B.size); };
  const bestCustomer = (name) => {
    if (!name) return { c:null, score:0 };
    const exact = customers.find(c => normS(c.display_name)===normS(name)); if (exact) return { c: exact, score: 1 };
    let best=null, bs=0; customers.forEach(c => { const v=sim(c.display_name,name); if(v>bs){bs=v;best=c;} });
    const inc = customers.find(c => normS(c.display_name).includes(normS(name)) || normS(name).includes(normS(c.display_name)));
    if (inc && bs < 0.5) return { c: inc, score: 0.6 };
    return best && bs>=0.34 ? { c: best, score: bs } : { c:null, score:0 };
  };
  const bestItem = (name, desc) => {
    const q = normS(name);
    const exact = q ? catalog.find(x => normS(x.name)===q || (x.sku && normS(x.sku)===q)) : null; if (exact) return { it: exact, score: 1 };
    let best=null, bs=0; catalog.forEach(x => { const v=Math.max(sim(x.name,name), sim(x.name,desc)); if(v>bs){bs=v;best=x;} });
    return best && bs>=0.4 ? { it: best, score: bs } : { it:null, score:0 };
  };
  const onDocFile = async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return; e.target.value = "";
    setErr(""); setDocBusy(true); setDocReview(null);
    try {
      const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("Could not read file")); r.readAsDataURL(f); });
      let mt = f.type || ""; if (!mt && /\.pdf$/i.test(f.name)) mt = "application/pdf";
      if (/heic|heif/i.test(mt) || /\.hei[cf]$/i.test(f.name)) throw new Error("HEIC photos aren't supported yet — use the PDF, or take a screenshot of the document instead.");
      if (!mt) throw new Error("Unknown file type — use a PDF or a JPG/PNG photo.");
      const { data, error } = await supabase.functions.invoke("parse-document", { body: { file_base64: b64, media_type: mt, filename: f.name, tenant_id: tenant.id } });
      if (error) throw new Error(error.message);
      if (!data || !data.success) throw new Error((data && data.error) || "Could not read the document");
      const pd = data.parsed;
      const cm = bestCustomer(pd.customer_name);
      const lns = pd.lines.map(l => { const m = bestItem(l.item, l.description); return { ...l, match: m.it, score: m.score, usePrice: "doc" }; });
      setDocReview({ p: pd, cust: cm.c, custScore: cm.score, custName: cm.c ? cm.c.display_name : pd.customer_name, lines: lns, fileName: f.name, poPick: pd.po_number || "N/A" });
    } catch (ex) { setErr(ex.message); }
    setDocBusy(false);
  };
  const applyDoc = async () => {
    const r = docReview; if (!r) return;
    const cust = r.cust;
    const name = (r.custName || r.p.customer_name || "").trim();
    setCustomer(name);
    const cid = cust ? cust.id : null; setCustomerId(cid);
    setTierName(cust && cust.primary_price_level_id ? ((priceLevels.find(x=>x.id===cust.primary_price_level_id)||{}).name||"") : "");
    if (r.p.doc_date) setDate(r.p.doc_date);
    setPoNumber((r.poPick || "N/A").trim() || "N/A");
    const built = [];
    for (const l of r.lines) {
      const it = l.match;
      let rate = l.unit_price;
      if (l.usePrice === "ours" && it) rate = await resolveRate(cid, it.source, it.id, it.base);
      const itemName = it ? it.name : (l.item || l.description);
      const descText = it ? l.description : (l.item ? l.description : "");
      built.push({ item: itemName, desc: descText, qty: l.qty, rate: Number(rate)||0, item_source: it ? it.source : null, item_id: it ? it.id : null, base_rate: it ? it.base : undefined });
    }
    if (built.length) setLines(built);
    const label = r.p.doc_type==="po" ? "PO" : r.p.doc_type==="estimate" ? "estimate" : "document";
    const src = `From ${label}${r.p.po_number ? " #"+r.p.po_number : ""} (${r.fileName})`;
    setNotes(n => [n, r.p.notes, src].filter(Boolean).join("\n"));
    setDocReview(null);
  };

  const qtyOf = (l) => (l.qty===""||l.qty==null) ? 1 : (Number(l.qty)||0);
  const total = useMemo(() => lines.reduce((s,l) => s + qtyOf(l) * (Number(l.rate)||0), 0), [lines]);

  const save = async () => {
    setErr("");
    if (!customer.trim()) { setErr("Customer is required"); return; }
    const validLines = lines.filter(l => l.item.trim() || l.desc.trim() || Number(l.qty) || Number(l.rate));
    if (validLines.length === 0) { setErr("Add at least one line item"); return; }

    const newLines = validLines.map(l => ({ ...l, qty: qtyOf(l), rate: Number(l.rate)||0 }));

    if (editing) {
      setSaving(true);
      try {
        await supabase.from("work_orders").update({ customer: customer.trim(), customer_id: customerId, technician: technician.trim(), date, lines: newLines, notes, po_number: poNumber.trim() || null }).eq("id", editing.id);
        if (editing.invoice_qbo_id) {
          // Already invoiced -> push the change to the QuickBooks invoice
          const { data, error } = await supabase.functions.invoke("qbo-update-invoice", {
            body: { invoice_id: editing.invoice_qbo_id, tenant_id: tenant.id, wo: { ...editing, customer: customer.trim(), technician: technician.trim(), date, lines: newLines, po_number: poNumber.trim() || null } },
          });
          if (error) throw new Error(error.message);
          if (!data || !data.success) throw new Error((data && data.error) || "Update failed");
          onUpdated ? onUpdated(data) : onSaved();
        } else {
          // Open work order (not invoiced yet) -> save changes to Supabase only
          onUpdated ? onUpdated(null) : onSaved();
        }
      } catch (e) { setErr(e.message); }
      setSaving(false);
      return;
    }

    setSaving(true);
    try {
      const { data: num, error: numErr } = await supabase.rpc("fn_next_wo_number", { p_tenant_id: tenant.id });
      if (numErr) throw numErr;
      const woId = String(num);

      const { error } = await supabase.from("work_orders").insert({
        id: woId,
        tenant_id: tenant.id,
        date,
        customer: customer.trim(),
        customer_id: customerId,
        technician: technician.trim(),
        lines: newLines,
        status: "open",
        notes,
        po_number: poNumber.trim() || null,
        created_by: user.id,
      });
      if (error) throw error;
      onSaved();
    } catch (e) {
      setErr(e.message);
    }
    setSaving(false);
  };

  return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">{editing ? (editing.invoice_qbo_id ? `Edit Invoice #${editing.invoice_no || editing.id}` : `Edit Work Order #${editing.id}`) : "New Work Order"}</div>
          <div className="sheet-meta">{editing ? (editing.invoice_qbo_id ? "Change lines or rates, then update the QuickBooks invoice" : "Change lines or rates, then save") : <>Fill out like a QuickBooks invoice — save when ready · <b>{customers.length}</b> customers, <b>{catalog.length}</b> items loaded</>}</div>
        </div>
        {!editing && (
          <label className="btn btn-outline btn-sm" style={{cursor:"pointer",whiteSpace:"nowrap",opacity:docBusy?0.6:1}}>
            {docBusy ? "⏳ Reading document…" : "📄 Upload PO / Estimate"}
            <input type="file" accept=".pdf,image/*" onChange={onDocFile} disabled={docBusy} style={{display:"none"}}/>
          </label>
        )}
      </div>

      {docReview && (
        <div style={{border:"2px solid #2563eb",borderRadius:10,padding:14,marginBottom:14,background:"#f7faff"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
            <div>
              <div style={{fontWeight:800,fontSize:15}}>📄 Review what I read — nothing is saved yet</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{docReview.fileName} · detected: <b>{docReview.p.doc_type==="po"?"Purchase Order":docReview.p.doc_type==="estimate"?"Estimate":docReview.p.doc_type==="invoice"?"Invoice":"Document"}</b>{docReview.p.total ? ` · document total ${fmt$(docReview.p.total)}` : ""}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn-text" onClick={()=>setDocReview(null)}>Cancel</button>
              <button className="btn btn-primary btn-sm" onClick={applyDoc}>Use this → fill work order</button>
            </div>
          </div>
          {docReview.p.warnings.length>0 && <div className="ic-issue warn" style={{marginTop:8}}>⚠ {docReview.p.warnings.join(" · ")}</div>}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10,marginTop:10,fontSize:13}}>
            <div>
              <div className="label">Customer</div>
              <select className="input" value={docReview.custName} onChange={e=>{ const v=e.target.value; const c=customers.find(x=>x.display_name===v); setDocReview(r=>({...r,custName:v,cust:c||null,custScore:c?1:0})); }}>
                {!docReview.cust && <option value={docReview.p.customer_name}>{docReview.p.customer_name || "(none read)"} — new customer</option>}
                {customers.map(c=><option key={c.id} value={c.display_name}>{c.display_name}</option>)}
              </select>
              <div style={{fontSize:11,marginTop:2,color: docReview.cust ? (docReview.custScore>=0.99 ? "var(--inv)" : "var(--brass)") : "var(--red)"}}>
                {docReview.cust ? (docReview.custScore>=0.99 ? "✓ exact match" : `≈ best match for "${docReview.p.customer_name}" — please confirm`) : `Not in your customers — will be added as "${docReview.p.customer_name || "?"}"`}
              </div>
            </div>
            <div>
              <div className="label">PO / Ref #</div>
              <select className="input" value={docReview.poPick} onChange={e=>setDocReview(r=>({...r,poPick:e.target.value}))}>
                <option value={docReview.p.po_number}>{docReview.p.po_number}{docReview.p.po_source ? ` — from "${docReview.p.po_source}"` : ""}{docReview.p.po_number!=="N/A" ? " ✓ best pick" : ""}</option>
                {(docReview.p.po_candidates||[]).filter(c=>c.value && c.value!==docReview.p.po_number).map((c,i)=><option key={i} value={c.value}>{c.value} — {c.label}</option>)}
                {docReview.p.po_number!=="N/A" && <option value="N/A">N/A — no PO used</option>}
              </select>
              <div style={{fontSize:11,marginTop:2,color: docReview.p.po_number==="N/A" ? "var(--muted)" : "var(--inv)"}}>
                {docReview.p.po_number==="N/A"
                  ? ((docReview.p.po_candidates||[]).length ? "No PO found — other numbers on the document are listed if one applies" : "No PO or reference number found on this document")
                  : `Auto-picked the customer's PO${(docReview.p.po_candidates||[]).length>1 ? " — other numbers on the page are in the list if a different one is right" : ""}`}
              </div>
            </div>
            <div><div className="label">Date</div><div className="input" style={{background:"#fff"}}>{docReview.p.doc_date || <span style={{color:"var(--muted)"}}>none found (keeps today)</span>}</div></div>
          </div>
          <div style={{marginTop:10,overflowX:"auto"}}>
            <table className="ic-prev" style={{background:"#fff"}}>
              <thead><tr><th>Item (from document)</th><th>Matched to your catalog</th><th>Qty</th><th>Doc price</th><th>Your base</th><th>Use</th></tr></thead>
              <tbody>
                {docReview.lines.map((l,i)=>(
                  <tr key={i}>
                    <td style={{whiteSpace:"normal",maxWidth:220}}><b>{l.item || l.description}</b>{l.item && l.description && l.description!==l.item ? <div style={{color:"var(--muted)"}}>{l.description}</div> : null}</td>
                    <td style={{whiteSpace:"normal",minWidth:180}}>
                      <select className="input" style={{fontSize:12,padding:"4px 6px"}} value={l.match?`${l.match.source}:${l.match.id}`:""} onChange={e=>{ const v=e.target.value; const it=catalog.find(x=>`${x.source}:${x.id}`===v)||null; setDocReview(r=>({...r,lines:r.lines.map((x,idx)=>idx===i?{...x,match:it,score:it?1:0}:x)})); }}>
                        <option value="">— not matched (add as typed) —</option>
                        {catalog.map(x=><option key={`${x.source}:${x.id}`} value={`${x.source}:${x.id}`}>{x.name}{x.sku?` (${x.sku})`:""}</option>)}
                      </select>
                      {l.match && <div style={{fontSize:11,color:l.score>=0.99?"var(--inv)":"var(--brass)"}}>{l.score>=0.99?"✓ exact":"≈ suggested — confirm"}</div>}
                    </td>
                    <td>{l.qty}</td>
                    <td>{fmt$(l.unit_price)}</td>
                    <td>{l.match ? fmt$(l.match.base) : <span style={{color:"var(--muted)"}}>—</span>}</td>
                    <td>
                      <select className="input" style={{fontSize:12,padding:"4px 6px"}} value={l.usePrice} disabled={!l.match} onChange={e=>{ const v=e.target.value; setDocReview(r=>({...r,lines:r.lines.map((x,idx)=>idx===i?{...x,usePrice:v}:x)})); }}>
                        <option value="doc">Doc price</option>
                        <option value="ours">Our price</option>
                      </select>
                    </td>
                  </tr>
                ))}
                {docReview.lines.length===0 && <tr><td colSpan={6} style={{color:"var(--muted)"}}>No line items could be read from this document.</td></tr>}
              </tbody>
            </table>
          </div>
          <div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>"Doc price" keeps what's on the document (what the customer agreed to). "Our price" uses your catalog with this customer's tier applied. Every line stays editable after filling.</div>
        </div>
      )}

      {err && <div className="alert alert-error">{err}</div>}

      <div className="hdr-grid">
        <div className="fg" style={{position:"relative"}}>
          <label className="label">Customer {tierName && <span style={{color:"var(--brass)",fontWeight:700}}>· {tierName}</span>}</label>
          <input className="input" value={customer}
            onChange={e=>{ onCustomerChange(e.target.value); setCustOpen(true); }}
            onFocus={()=>setCustOpen(true)}
            onBlur={()=>setTimeout(()=>setCustOpen(false),200)}
            placeholder="Customer name" autoComplete="off" autoFocus/>
          {custOpen && custMatches.length>0 && (
            <div className="ac-menu">
              {custMatches.map(c=>(
                <div key={c.id} className="ac-item"
                  onMouseDown={e=>{ e.preventDefault(); onCustomerChange(c.display_name); setCustOpen(false); }}>
                  <span>{c.display_name}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        <div className="fg">
          <label className="label">Date</label>
          <input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        <div className="fg">
          <label className="label">Technician</label>
          <input className="input" value={technician} onChange={e=>setTechnician(e.target.value)} placeholder="Tech name"/>
        </div>
        <div className="fg">
          <label className="label">Customer PO #</label>
          <div style={{display:"flex",gap:6}}>
            <input className="input" value={poNumber} onChange={e=>setPoNumber(e.target.value)} placeholder="PO number — or N/A if none" style={{flex:1}}/>
            <button type="button" className="btn btn-outline btn-sm" onClick={()=>setPoNumber(poNumber==="N/A" ? "" : "N/A")} style={{whiteSpace:"nowrap"}} title="Mark that no PO is used">{poNumber==="N/A" ? "Clear" : "N/A"}</button>
          </div>
        </div>
      </div>

      <table className="linegrid">
        <thead>
          <tr>
            <th className="cnum">#</th>
            <th style={{width: hideRates ? "30%" : "24%"}}>Product/Service</th>
            <th>Description</th>
            <th className="num" style={{width:"10%"}}>Qty</th>
            {!hideRates && <th className="num" style={{width:"12%"}}>Rate</th>}
            {!hideRates && <th className="num" style={{width:"14%"}}>Amount</th>}
            <th style={{width:"36px"}}></th>
          </tr>
        </thead>
        <tbody>
          {lines.map((l,i)=>(
            <tr key={i}>
              <td className="row-num">{i+1}</td>
              <td data-l="Product/Service" style={{position:"relative"}}>
                <input className="cell-input" value={l.item}
                  onChange={e=>{ onItemChange(i,e.target.value); setActiveItem(i); }}
                  onFocus={()=>setActiveItem(i)}
                  onBlur={()=>setTimeout(()=>setActiveItem(-1),200)}
                  placeholder="Service or SKU" autoComplete="off"/>
                {activeItem===i && itemMatches(l.item).length>0 && (
                  <div className="ac-menu">
                    {itemMatches(l.item).map(x=>(
                      <div key={x.source+x.id} className="ac-item"
                        onMouseDown={e=>{ e.preventDefault(); onItemChange(i, x.name); setActiveItem(-1); }}>
                        <span>{x.name}</span>
                        <span style={{color:"var(--muted)",fontSize:11}}>{x.base?("$"+Number(x.base).toFixed(2)):""}</span>
                      </div>
                    ))}
                  </div>
                )}
              </td>
              <td data-l="Description">
                <input className="cell-input" value={l.desc} onChange={e=>updateLine(i,{desc:e.target.value})} placeholder="Detail"/>
              </td>
              <td data-l="Qty">
                <input className="cell-input num" type="number" step="0.01" placeholder="1" value={l.qty} onFocus={e=>e.target.select()} onChange={e=>updateLine(i,{qty:e.target.value})}/>
              </td>
              {!hideRates && <td data-l="Rate">
                <input className="cell-input num" type="number" step="0.01" value={l.rate} onChange={e=>updateLine(i,{rate:e.target.value})}/>
              </td>}
              {!hideRates && <td data-l="Amount" className="cell-amount">{fmt$(qtyOf(l)*(Number(l.rate)||0))}</td>}
              <td className="row-del"><button onClick={()=>delLine(i)} title="Delete">✕</button></td>
            </tr>
          ))}
        </tbody>
      </table>

      <div className="line-tools">
        <button className="btn-text" onClick={addLine}>＋ Add lines</button>
        <button className="btn-text" onClick={clearLines} style={{color:"var(--red)"}}>✕ Clear all lines</button>
      </div>

      <div className="fg">
        <label className="label">Notes</label>
        <textarea className="input" rows="2" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Optional notes (internal)"></textarea>
      </div>

      {!hideRates && (
        <div className="totals">
          <div className="totals-box">
            <div className="totals-row"><span>Subtotal</span><span className="val">{fmt$(total)}</span></div>
            <div className="totals-row total"><span>Total</span><span className="val">{fmt$(total)}</span></div>
          </div>
        </div>
      )}

      <div className="action-bar">
        <button className="btn btn-primary" onClick={save} disabled={saving}>
          {editing ? (editing.invoice_qbo_id ? (saving ? "Updating…" : "Update QuickBooks Invoice") : (saving ? "Saving…" : "Save Changes")) : (saving ? "Saving…" : "Save Work Order")}
        </button>
      </div>
    </div>
  );
}

// ─── PRINTER + PDF ───────────────────────────────────────────────────────────
function buildWoPdf(wo, hideRates){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const lines = wo.lines || [];
  doc.setFontSize(18); doc.setFont(undefined,"bold");
  doc.text("WORK ORDER", 14, 20);
  doc.setFontSize(12); doc.text("#"+wo.id, 196, 20, {align:"right"});
  doc.setFontSize(10); doc.setFont(undefined,"normal");
  doc.text("Customer: "+(wo.customer||""), 14, 32);
  doc.text("Date: "+(wo.date||"")+"     Tech: "+(wo.technician||"—")+(wo.po_number ? "     PO: "+wo.po_number : ""), 14, 38);
  doc.line(14, 44, 196, 44);
  let y = 52;
  doc.setFont(undefined,"bold");
  doc.text("Qty", 14, y); doc.text("Item", 32, y);
  if(!hideRates){ doc.text("Rate", 168, y, {align:"right"}); doc.text("Amount", 196, y, {align:"right"}); }
  y += 2; doc.line(14, y, 196, y); y += 7; doc.setFont(undefined,"normal");
  let total = 0;
  for(const l of lines){
    const qty = (l.qty===""||l.qty==null)?1:(Number(l.qty)||0);
    const amt = qty*(Number(l.rate)||0); total += amt;
    doc.text(String(qty), 14, y);
    const label = String(l.item||"") + (l.desc ? (" — "+l.desc) : "");
    const wrapped = doc.splitTextToSize(label, 128);
    doc.text(wrapped, 32, y);
    if(!hideRates){ doc.text(fmt$(Number(l.rate)||0), 168, y, {align:"right"}); doc.text(fmt$(amt), 196, y, {align:"right"}); }
    y += 6 + (wrapped.length-1)*5;
    if(y > 270){ doc.addPage(); y = 20; }
  }
  if(!hideRates){ y += 3; doc.line(150, y, 196, y); y += 7; doc.setFont(undefined,"bold"); doc.text("TOTAL", 150, y, {align:"right"}); doc.text(fmt$(total), 196, y, {align:"right"}); }
  if(wo.notes){ y += 12; doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.text(doc.splitTextToSize("Notes: "+wo.notes, 182), 14, y); }
  return doc.output("datauristring").split("base64,")[1];
}

// ─── STEP 2: OPEN WO LIST ────────────────────────────────────────────────────
function OpenList({ workOrders, hideRates, loading, onPickInvoice, onCreateNew, onEditInvoiced, onEditOpen, qboConnected, user, onReload, mayInvoice, canCreate, printerEmail }) {
  const open = workOrders.filter(w => w.status === "open");
  const recent = workOrders.filter(w => w.status === "invoiced").slice(0, 5);

  const woTotal = (wo) => (wo.lines || []).reduce((s,l) => s + (Number(l.qty)||0)*(Number(l.rate)||0), 0);

  const [printMsg, setPrintMsg] = useState("");
  const doPrint = async (wo) => {
    if (!printerEmail) { setPrintMsg("Add your printer email in Settings first"); setTimeout(()=>setPrintMsg(""), 4500); return; }
    try {
      setPrintMsg("Sending WO #"+wo.id+" to the printer…");
      const pdf = buildWoPdf(wo, hideRates);
      const { data, error } = await supabase.functions.invoke("email-print", { body: { to: printerEmail, subject:"Work Order #"+wo.id+" — "+wo.customer, filename:"WO-"+wo.id+".pdf", pdf_base64: pdf } });
      if (error) throw new Error(error.message);
      if (data && data.error) throw new Error(typeof data.error==="string"?data.error:JSON.stringify(data.error));
      setPrintMsg("✓ Sent WO #"+wo.id+" to the printer");
    } catch(e) { setPrintMsg("Print failed: "+e.message); }
    setTimeout(()=>setPrintMsg(""), 5000);
  };

  // ── Batch invoicing ──
  const [selected, setSelected] = useState({});
  const [batchRunning, setBatchRunning] = useState(false);
  const [batchResult, setBatchResult] = useState(null);
  // Work orders invoiced during this session — kept out of re-selection even
  // before the list reloads, so a work order can never be pushed to QBO twice.
  const [invoicedNow, setInvoicedNow] = useState({});
  const selectable = open.filter(w => !w.invoice_qbo_id && !invoicedNow[w.id]);
  const selectedIds = selectable.filter(w => selected[w.id]).map(w => w.id);
  const toggleOne = (id) => setSelected(s => ({ ...s, [id]: !s[id] }));
  const toggleAll = () => {
    if (selectedIds.length === selectable.length) setSelected({});
    else { const all = {}; selectable.forEach(w => all[w.id] = true); setSelected(all); }
  };
  const runBatch = async () => {
    if (!qboConnected) { alert("Connect QuickBooks first in Settings."); return; }
    const targets = selectable.filter(w => selected[w.id]);
    if (!targets.length) return;
    if (!window.confirm(`Create ${targets.length} live invoice${targets.length!==1?"s":""} in QuickBooks?\n\nEach is saved (not sent) so you can review before sending.`)) return;
    setBatchResult(null); setBatchRunning(true);
    const ok = [], fail = [], unmarked = [];
    for (const wo of targets) {
      // Never push a work order that already carries an invoice.
      if (wo.invoice_qbo_id || invoicedNow[wo.id]) { fail.push({ id: wo.id, error: "already invoiced — skipped to prevent a duplicate" }); continue; }
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-create-invoice`, {
          method: "POST",
          headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify({ wo, tenant_id: wo.tenant_id }),
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || "QBO push failed");
        // QuickBooks has the invoice now — lock this WO immediately so it can't be re-pushed.
        setInvoicedNow(s => ({ ...s, [wo.id]: true }));
        // Mark it invoiced locally; retry a couple of times if the write blips.
        let marked = false, lastErr = null;
        for (let attempt = 0; attempt < 3 && !marked; attempt++) {
          const { error: uErr } = await supabase.from("work_orders").update({
            status: "invoiced", invoice_no: data.invoiceNum, invoice_qbo_id: data.invoiceId, invoiced_by: user.email,
          }).eq("id", wo.id);
          if (!uErr) marked = true; else { lastErr = uErr; await new Promise(r => setTimeout(r, 400)); }
        }
        if (marked) ok.push({ id: wo.id, num: data.invoiceNum });
        else unmarked.push({ id: wo.id, num: data.invoiceNum, error: lastErr ? lastErr.message : "unknown" });
      } catch (e) {
        fail.push({ id: wo.id, error: e.message });
      }
      // Brief pause between pushes so QuickBooks doesn't throttle a long batch.
      await new Promise(r => setTimeout(r, 350));
    }
    setBatchResult({ ok, fail, unmarked });
    setSelected({});
    setBatchRunning(false);
    onReload && onReload();
  };

  if (loading) return <div className="sheet"><div className="empty-state">Loading…</div></div>;

  return (
    <>
      <div className="sheet">
        <div className="sheet-h">
          <div>
            <div className="sheet-title">Open Work Orders</div>
            <div className="sheet-meta">{open.length} awaiting invoice</div>
          </div>
          {canCreate && <button className="btn btn-primary btn-sm" onClick={onCreateNew}>＋ New</button>}
        </div>
        {printMsg && <div style={{background:"#eef6f1",border:"1px solid #2ca01c",borderRadius:6,padding:"8px 12px",margin:"0 0 10px",fontSize:13}}>{printMsg}</div>}

        {batchResult && (
          <div style={{background: batchResult.fail.length ? "#fef9e7" : "#eef6f1", border:"1px solid "+(batchResult.fail.length?"#e7c389":"#2ca01c"), borderRadius:6, padding:"10px 12px", marginBottom:10, fontSize:13}}>
            <div><b>✓ {batchResult.ok.length} invoice{batchResult.ok.length!==1?"s":""} created</b>{batchResult.fail.length ? ` · ${batchResult.fail.length} failed` : ""}</div>
            {batchResult.fail.length > 0 && (
              <div style={{marginTop:6}}>
                {batchResult.fail.map(f => <div key={f.id} style={{color:"var(--red)"}}>WO #{f.id}: {f.error}</div>)}
              </div>
            )}
            {batchResult.unmarked && batchResult.unmarked.length > 0 && (
              <div style={{marginTop:8,padding:"8px 10px",background:"#fdecec",border:"1px solid #e5a0a0",borderRadius:6,color:"#8b1a1a"}}>
                <b>⚠ Invoiced in QuickBooks but couldn't be marked here — do NOT invoice these again:</b>
                {batchResult.unmarked.map(u => <div key={u.id}>WO #{u.id} → QuickBooks invoice #{u.num}</div>)}
                <div style={{marginTop:4,fontSize:12}}>Refresh the page; they should show as invoiced. If not, tell support.</div>
              </div>
            )}
          </div>
        )}

        {open.length > 0 && mayInvoice && (
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,flexWrap:"wrap"}}>
            <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
              <input type="checkbox" checked={open.length>0 && selectedIds.length===open.length} onChange={toggleAll}/>
              Select all
            </label>
            {selectedIds.length>0 && <span style={{fontSize:13,color:"var(--muted)"}}>{selectedIds.length} selected</span>}
            <div style={{flex:1}}/>
            <button className="btn btn-primary btn-sm"
              disabled={selectedIds.length===0 || batchRunning || !qboConnected}
              onClick={runBatch}
              title={!qboConnected ? "Connect QuickBooks in Settings first" : ""}>
              {batchRunning ? "Creating…" : `Create ${selectedIds.length ? selectedIds.length+" " : ""}Invoice${selectedIds.length===1?"":"s"} → QBO`}
            </button>
          </div>
        )}

        {open.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">📋</div>
            <div className="empty-state-h">No open work orders</div>
            <div className="empty-state-p">Create one to get started. Open WOs appear here until invoiced.</div>
          </div>
        ) : (
          open.map(wo => (
            <div key={wo.id} className="wo-card">
              <div className="wo-meta-l" style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                {mayInvoice && <input type="checkbox" checked={!!selected[wo.id]} onChange={()=>toggleOne(wo.id)} style={{marginTop:3,width:16,height:16,flexShrink:0,cursor:"pointer"}}/>}
                <div style={{minWidth:0}}>
                  <div className="wo-id">WO #{wo.id} · {wo.date}</div>
                  <div className="wo-customer">{wo.customer}</div>
                  <div className="wo-info">
                    {wo.technician || "—"} · {(wo.lines||[]).length} line{(wo.lines||[]).length!==1?"s":""}{wo.po_number ? <> · PO <b>{wo.po_number}</b></> : null}
                  </div>
                </div>
              </div>
              <div className="wo-meta-r">
                {!hideRates && <div className="wo-amt">{fmt$(woTotal(wo))}</div>}
                <span className="wo-pill open">Open</span>
              </div>
              <div className="wo-actions">
                {canCreate && <button className="btn btn-outline btn-sm" onClick={()=>onEditOpen(wo)}>✎ Edit</button>}
                <button className="btn btn-outline btn-sm" onClick={()=>doPrint(wo)}>🖨 Print</button>
                {mayInvoice && (
                <button className="btn btn-outline btn-sm" onClick={()=>onPickInvoice(wo)}>
                  <span style={{display:"inline-block",width:6,height:6,borderRadius:"50%",background:"var(--red)"}}/>
                  Create Invoice
                </button>
                )}
              </div>
            </div>
          ))
        )}
      </div>

      {recent.length > 0 && (
        <div className="sheet">
          <div className="sheet-h">
            <div>
              <div className="sheet-title" style={{fontSize:15}}>Recently Invoiced</div>
              <div className="sheet-meta">Last 5</div>
            </div>
          </div>
          {recent.map(wo => (
            <div key={wo.id} className="wo-card invoiced">
              <div className="wo-meta-l">
                <div className="wo-id">WO #{wo.id} · Inv #{wo.invoice_no || "—"}</div>
                <div className="wo-customer">{wo.customer}</div>
                <div className="wo-info">{wo.date} · {wo.technician || "—"}</div>
              </div>
              <div className="wo-meta-r">
                {!hideRates && <div className="wo-amt">{fmt$(woTotal(wo))}</div>}
                <span className="wo-pill invoiced">Invoiced</span>
              </div>
              <div className="wo-actions">
                {mayInvoice && <button className="btn btn-outline btn-sm" onClick={()=>onEditInvoiced(wo)}>✎ Edit</button>}
              </div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

// ─── STEP 3: INVOICE PUSH ────────────────────────────────────────────────────
function InvoicePush({ wo, qboConnected, user, onDone, onBack, mayInvoice }) {
  const [pushing, setPushing] = useState(false);
  const [err, setErr] = useState("");
  const [posted, setPosted] = useState(null);

  if (!wo) return (
    <div className="sheet">
      <div className="empty-state">
        <div className="empty-state-h">No work order selected</div>
        <button className="btn btn-outline btn-sm" onClick={onBack} style={{marginTop:10}}>← Back to list</button>
      </div>
    </div>
  );

  const woTotal = (wo.lines || []).reduce((s,l) => s + (Number(l.qty)||0)*(Number(l.rate)||0), 0);

  const pushToQbo = async () => {
    if (!qboConnected) { setErr("QuickBooks is not connected. Connect it in Settings first."); return; }
    if (wo.invoice_qbo_id) { setErr(`This work order already has QuickBooks invoice #${wo.invoice_no || wo.invoice_qbo_id} — not creating another.`); return; }
    if (!window.confirm(`Post a LIVE invoice to QuickBooks for ${wo.customer}?\n\nIt will be saved (not sent) so you can review it in QuickBooks before sending.`)) return;
    setErr(""); setPushing(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-create-invoice`, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ wo, tenant_id: wo.tenant_id }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || "QBO push failed");

      const { error: uErr } = await supabase.from("work_orders").update({
        status: "invoiced",
        invoice_no: data.invoiceNum,
        invoice_qbo_id: data.invoiceId,
        invoiced_by: user.email,
      }).eq("id", wo.id);
      if (uErr) setErr(`Invoice #${data.invoiceNum} was created in QuickBooks, but marking it here failed (${uErr.message}). Do NOT create it again — refresh and it should show as invoiced.`);

      const qboUrl = `https://app.qbo.intuit.com/app/invoice?txnId=${data.invoiceId}`;
      setPosted({ id: data.invoiceId, num: data.invoiceNum, url: qboUrl });
      try { window.open(qboUrl, "_blank"); } catch (e) {}
    } catch (e) {
      setErr(e.message);
    }
    setPushing(false);
  };

  if (posted) return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">✅ Invoice Created</div>
          <div className="sheet-meta">WO #{wo.id} · {wo.customer}</div>
        </div>
      </div>
      <div style={{background:"#eafaf0",border:"1px solid #2ca01c",borderRadius:8,padding:16,marginBottom:16}}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:4}}>Invoice #{posted.num} saved to QuickBooks</div>
        <div style={{fontSize:13,color:"var(--muted)"}}>It's saved but <b>not sent</b>. Review it in QuickBooks, then send when you're ready.</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <a className="btn btn-primary" href={posted.url} target="_blank" rel="noopener noreferrer" style={{textDecoration:"none",textAlign:"center"}}>
          Open Invoice #{posted.num} in QuickBooks →
        </a>
        <button className="btn btn-outline" onClick={onDone}>Done — back to work orders</button>
      </div>
    </div>
  );

  return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">Create Invoice in QuickBooks</div>
          <div className="sheet-meta">WO #{wo.id} · {wo.customer}</div>
        </div>
        <button className="btn btn-text" onClick={onBack}>← Back</button>
      </div>

      {err && <div className="alert alert-error">{err}</div>}

      {/* Read-only summary */}
      <div className="hdr-grid" style={{padding:"12px",background:"#fafaf6",borderRadius:6,marginBottom:16}}>
        <div><div className="label">Customer</div><div style={{fontWeight:700}}>{wo.customer}</div></div>
        <div><div className="label">Date</div><div>{wo.date}</div></div>
        <div><div className="label">Technician</div><div>{wo.technician || "—"}</div></div>
      </div>

      <table className="linegrid">
        <thead><tr>
          <th className="cnum">#</th>
          <th>Product/Service</th>
          <th>Description</th>
          <th className="num">Qty</th>
          <th className="num">Rate</th>
          <th className="num">Amount</th>
        </tr></thead>
        <tbody>
          {(wo.lines||[]).map((l,i)=>(
            <tr key={i}>
              <td className="row-num">{i+1}</td>
              <td data-l="Product/Service" style={{padding:"10px"}}>{l.item || "—"}</td>
              <td data-l="Description" style={{padding:"10px"}}>{l.desc || "—"}</td>
              <td data-l="Qty" className="cell-amount" style={{textAlign:"right"}}>{l.qty}</td>
              <td data-l="Rate" className="cell-amount" style={{textAlign:"right"}}>{fmt$(l.rate)}</td>
              <td data-l="Amount" className="cell-amount">{fmt$((Number(l.qty)||0)*(Number(l.rate)||0))}</td>
            </tr>
          ))}
        </tbody>
      </table>

      <div className="totals">
        <div className="totals-box">
          <div className="totals-row"><span>Subtotal</span><span className="val">{fmt$(woTotal)}</span></div>
          <div className="totals-row total"><span>Total</span><span className="val">{fmt$(woTotal)}</span></div>
        </div>
      </div>

      <div className="qbo-push-card" style={{marginTop:24}}>
        {!qboConnected && (
          <div className="alert alert-info" style={{marginBottom:16}}>
            Connect QuickBooks first to push invoices. We'll add this to Settings shortly.
          </div>
        )}
        <p style={{fontSize:13,color:"var(--muted)",marginBottom:16}}>
          This creates a <strong>draft invoice</strong> in QuickBooks. Customer is not emailed until you click Send in QBO.
        </p>
        <button className="btn-qbo-push" onClick={pushToQbo} disabled={pushing || !qboConnected || !mayInvoice}>
          <span className="red-dot"/>
          {pushing ? "Pushing to QuickBooks…" : "Create Invoice → QuickBooks"}
        </button>
      </div>
    </div>
  );
}

// ─── SETTINGS MODAL ──────────────────────────────────────────────────────────
// ─── TEAM MANAGEMENT (Owner/Admin only) ─────────────────────────────────────
function TeamSection({ tenant, currentUserId }) {
  const [members, setMembers] = useState([]);
  const [invites, setInvites] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showInvite, setShowInvite] = useState(false);
  const [inviteEmail, setInviteEmail] = useState("");
  const [inviteRole, setInviteRole] = useState("tech");
  const [inviteInvoice, setInviteInvoice] = useState(false);
  const [busy, setBusy] = useState(false);

  const load = async () => {
    const [{ data: m }, { data: i }] = await Promise.all([
      supabase.from("tenant_users").select("*").eq("tenant_id", tenant.id).order("created_at"),
      supabase.from("tenant_invites").select("*").eq("tenant_id", tenant.id).is("accepted_at", null).order("invited_at", { ascending: false }),
    ]);
    setMembers(m || []);
    setInvites(i || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const sendInvite = async () => {
    const email = inviteEmail.trim().toLowerCase();
    if (!email) { alert("Email is required"); return; }
    if (seatsUsed >= seatLimit) { alert(`All ${seatLimit} seats are in use on the ${tenant.plan} plan. Remove a member or upgrade to add more.`); return; }
    setBusy(true);
    try {
      // Check for duplicate
      const { data: existing } = await supabase.from("tenant_invites")
        .select("id").eq("tenant_id", tenant.id).eq("email", email).is("accepted_at", null).maybeSingle();
      if (existing) { alert("An invite is already pending for that email."); setBusy(false); return; }

      const { error } = await supabase.from("tenant_invites").insert({
        tenant_id: tenant.id,
        email,
        role: inviteRole,
        can_invoice: inviteInvoice,
        invited_by: currentUserId,
        invited_by_email: tenant.owner_email,
      });
      if (error) throw error;

      alert(`✅ Invite created for ${email}.\n\nShare this link with them:\n${window.location.origin}\n\nThey should sign up with this exact email address. They'll automatically join your team.`);
      setInviteEmail(""); setInviteRole("tech"); setInviteInvoice(false); setShowInvite(false);
      load();
    } catch (e) {
      alert(`Failed to create invite: ${e.message}`);
    }
    setBusy(false);
  };

  const updateMember = async (id, patch) => {
    const { error } = await supabase.from("tenant_users").update(patch).eq("id", id);
    if (error) alert(`Failed to update: ${error.message}`);
    load();
  };

  const removeInvite = async (id) => {
    if (!confirm("Cancel this invitation?")) return;
    await supabase.from("tenant_invites").delete().eq("id", id);
    load();
  };

  const removeMember = async (id, email) => {
    if (!confirm(`Remove ${email} from the team? They'll lose access immediately.`)) return;
    await supabase.from("tenant_users").update({ active: false }).eq("id", id);
    load();
  };

  const seatLimit = SEAT_LIMITS[tenant.plan] || 5;
  const seatsUsed = members.filter(m=>m.active).length + invites.length;

  return (
    <div className="settings-section">
      <div className="settings-h">Team Members</div>
      <div className="settings-sub">Invite teammates and assign roles. <b>{seatsUsed} of {seatLimit} seats used</b> on the {tenant.plan} plan.</div>

      {loading ? <div style={{fontSize:13,color:"var(--muted)"}}>Loading…</div> : (
        <>
          {/* Active members */}
          <div style={{marginBottom:12}}>
            {members.filter(m=>m.active).map(m => (
              <div key={m.id} style={{padding:"10px 12px",background:"#fafaf6",borderRadius:6,marginBottom:6,display:"grid",gridTemplateColumns:"1fr auto",gap:8,alignItems:"center"}}>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                    {m.email}
                    {m.user_id === currentUserId && <span style={{fontSize:10,marginLeft:6,padding:"1px 5px",background:"#d6eaf8",color:"#1b4f72",borderRadius:3}}>YOU</span>}
                  </div>
                  <div style={{fontSize:11,color:"var(--muted)",marginTop:2}}>
                    {m.role}{m.can_invoice && " · can invoice"}
                  </div>
                </div>
                <div style={{display:"flex",gap:4}}>
                  {m.user_id !== currentUserId && m.role !== "owner" && (
                    <>
                      <select value={m.role} onChange={e=>updateMember(m.id,{role:e.target.value})}
                        style={{fontSize:11,padding:"4px 6px",border:"1px solid var(--line)",borderRadius:4,fontFamily:"inherit"}}>
                        <option value="admin">Admin</option>
                        <option value="tech">Tech</option>
                        <option value="viewer">Viewer</option>
                      </select>
                      <label style={{display:"flex",alignItems:"center",gap:4,fontSize:11}}>
                        <input type="checkbox" checked={m.can_invoice} onChange={e=>updateMember(m.id,{can_invoice:e.target.checked})}/>
                        $
                      </label>
                      <button onClick={()=>removeMember(m.id, m.email)} title="Remove"
                        style={{background:"transparent",border:"none",color:"var(--red)",cursor:"pointer",fontSize:13,padding:"0 4px"}}>✕</button>
                    </>
                  )}
                </div>
              </div>
            ))}
          </div>

          {/* Pending invites */}
          {invites.length > 0 && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:600,color:"var(--muted)",marginBottom:6,textTransform:"uppercase",letterSpacing:0.5}}>Pending invitations</div>
              {invites.map(inv => (
                <div key={inv.id} style={{padding:"8px 12px",background:"#fef9e7",borderRadius:6,marginBottom:6,display:"grid",gridTemplateColumns:"1fr auto",gap:8,alignItems:"center"}}>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{inv.email}</div>
                    <div style={{fontSize:11,color:"var(--muted)"}}>{inv.role}{inv.can_invoice && " · can invoice"} · pending</div>
                  </div>
                  <button onClick={()=>removeInvite(inv.id)} title="Cancel invite"
                    style={{background:"transparent",border:"none",color:"var(--red)",cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              ))}
            </div>
          )}

          {/* Invite form */}
          {seatsUsed >= seatLimit ? (
            <div className="alert alert-info">All {seatLimit} seats on the {tenant.plan} plan are in use. Remove a member or upgrade your plan to add more.</div>
          ) : !showInvite ? (
            <button className="btn btn-outline btn-sm" onClick={()=>setShowInvite(true)}>＋ Invite Team Member</button>
          ) : (
            <div style={{padding:12,border:"1.5px dashed var(--inv)",borderRadius:6,marginTop:6}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>Invite Team Member</div>
              <div className="fg" style={{marginBottom:8}}>
                <label className="label">Email</label>
                <input className="input" type="email" value={inviteEmail} onChange={e=>setInviteEmail(e.target.value)} placeholder="tech@example.com" autoFocus disabled={busy}/>
              </div>
              <div className="fg" style={{marginBottom:8}}>
                <label className="label">Role</label>
                <select className="input" value={inviteRole} onChange={e=>setInviteRole(e.target.value)} disabled={busy}>
                  <option value="tech">Tech — Create & view work orders</option>
                  <option value="admin">Admin — Manage team & settings</option>
                  <option value="viewer">Viewer — Read-only access</option>
                </select>
              </div>
              <div className="fg" style={{marginBottom:10}}>
                <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
                  <input type="checkbox" checked={inviteInvoice} onChange={e=>setInviteInvoice(e.target.checked)} disabled={busy}/>
                  Allow this user to push invoices to QuickBooks
                </label>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn-text" onClick={()=>setShowInvite(false)} disabled={busy}>Cancel</button>
                <button className="btn btn-primary btn-sm" onClick={sendInvite} disabled={busy} style={{flex:1}}>
                  {busy ? "Sending…" : "Send Invite"}
                </button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}
