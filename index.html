// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function Dashboard({ workOrders, tenant, onOpenJobs }) {
  const qtyOf = (l) => (l.qty===""||l.qty==null) ? 1 : (Number(l.qty)||0);
  const woTotal = (wo) => (wo.lines||[]).reduce((s,l)=> s + qtyOf(l)*(Number(l.rate)||0), 0);
  const now = new Date();
  const ym = (d) => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); };
  const thisYM = ym(now);
  const open = workOrders.filter(w => w.status === "open");
  const invoiced = workOrders.filter(w => w.status === "invoiced");
  const invThisMonth = invoiced.filter(w => ym(w.date || w.created_at) === thisYM);
  const openVal = open.reduce((s,w)=>s+woTotal(w),0);
  const monthRev = invThisMonth.reduce((s,w)=>s+woTotal(w),0);
  const allRev = invoiced.reduce((s,w)=>s+woTotal(w),0);
  const months = [];
  for (let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({ key: ym(d), label: d.toLocaleString("default",{month:"short"}) }); }
  const revByMonth = months.map(m => ({ ...m, v: invoiced.filter(w=>ym(w.date||w.created_at)===m.key).reduce((s,w)=>s+woTotal(w),0) }));
  const maxRev = Math.max(1, ...revByMonth.map(m=>m.v));
  const techMap = {};
  invoiced.forEach(w => { const t=(w.technician||"").trim()||"Unassigned"; techMap[t]=techMap[t]||{n:0,v:0}; techMap[t].n++; techMap[t].v+=woTotal(w); });
  const topTechs = Object.entries(techMap).sort((a,b)=>b[1].v-a[1].v).slice(0,5);
  const custMap = {};
  invoiced.forEach(w => { const c=(w.customer||"").trim()||"—"; custMap[c]=custMap[c]||{n:0,v:0}; custMap[c].n++; custMap[c].v+=woTotal(w); });
  const topCust = Object.entries(custMap).sort((a,b)=>b[1].v-a[1].v).slice(0,5);
  const recent = workOrders.slice(0,6);
  return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">Dashboard</div>
          <div className="sheet-meta">{tenant.name} · live snapshot of your business</div>
        </div>
      </div>
      <div className="dash-grid">
        <div className="dash-card dash-a" onClick={onOpenJobs} style={{cursor:"pointer"}}>
          <div className="lbl">Open jobs</div>
          <div className="val">{open.length}</div>
          <div className="sub">{fmt$(openVal)} awaiting invoice</div>
        </div>
        <div className="dash-card dash-b">
          <div className="lbl">Invoiced this month</div>
          <div className="val">{fmt$(monthRev)}</div>
          <div className="sub">{invThisMonth.length} invoice{invThisMonth.length!==1?"s":""}</div>
        </div>
        <div className="dash-card dash-c">
          <div className="lbl">All-time invoiced</div>
          <div className="val">{fmt$(allRev)}</div>
          <div className="sub">{invoiced.length} total</div>
        </div>
        <div className="dash-card dash-d">
          <div className="lbl">Avg job value</div>
          <div className="val">{fmt$(invoiced.length ? allRev/invoiced.length : 0)}</div>
          <div className="sub">per invoice</div>
        </div>
      </div>
      <div className="dash-section">
        <h3>Revenue — last 6 months</h3>
        <div className="dash-bar">
          {revByMonth.map(m => (
            <div key={m.key} title={fmt$(m.v)}>
              <div style={{fontSize:10,marginBottom:2,color:"var(--ink)",fontWeight:600}}>{m.v>0?fmt$(m.v):""}</div>
              <div className="b" style={{height: Math.max(3, Math.round(m.v/maxRev*60))+"px"}}></div>
              <div style={{marginTop:4}}>{m.label}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
        <div className="dash-section">
          <h3>Top technicians</h3>
          {topTechs.length===0 && <div style={{fontSize:13,color:"var(--muted)"}}>No invoiced work yet.</div>}
          {topTechs.map(([t,x]) => <div key={t} className="dash-row"><span>{t}</span><span><b>{fmt$(x.v)}</b> · {x.n} job{x.n!==1?"s":""}</span></div>)}
        </div>
        <div className="dash-section">
          <h3>Top customers</h3>
          {topCust.length===0 && <div style={{fontSize:13,color:"var(--muted)"}}>No invoiced work yet.</div>}
          {topCust.map(([c,x]) => <div key={c} className="dash-row"><span>{c}</span><span><b>{fmt$(x.v)}</b> · {x.n}</span></div>)}
        </div>
      </div>
      <div className="dash-section">
        <h3>Recent activity</h3>
        {recent.length===0 && <div style={{fontSize:13,color:"var(--muted)"}}>No work orders yet — create your first one.</div>}
        {recent.map(w => (
          <div key={w.id} className="dash-row">
            <span>WO #{w.id} · {w.customer||"—"}</span>
            <span style={{color: w.status==="invoiced" ? "var(--inv)" : "var(--wip)", fontWeight:600, whiteSpace:"nowrap"}}>
              {w.status==="invoiced" ? `Invoiced${w.invoice_no?" #"+w.invoice_no:""}` : "Open"} · {fmt$(woTotal(w))}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── IMPORT CENTER ────────────────────────────────────────────────────────────
function ImportCenter({ tenant, onDone }) {
  const [step, setStep] = useState(1);
  const [kind, setKind] = useState(null);
  const [rows, setRows] = useState(null);
  const [cols, setCols] = useState([]);
  const [fileName, setFileName] = useState("");
  const [sheetName, setSheetName] = useState("");
  const [map, setMap] = useState({ name:"", sku:"", price:"", tier:"", levels:[] });
  const [existing, setExisting] = useState({ items:[], customers:[], levels:[] });
  const [review, setReview] = useState(null);
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => { (async () => {
    const [it, cu, lv] = await Promise.all([
      supabase.from("custom_skus").select("id,sku,name,price").eq("tenant_id",tenant.id),
      supabase.from("customers").select("id,display_name,primary_price_level_id").eq("tenant_id",tenant.id),
      supabase.from("price_levels").select("id,name,rank").eq("tenant_id",tenant.id).order("rank"),
    ]);
    setExisting({ items: it.data||[], customers: cu.data||[], levels: lv.data||[] });
  })(); }, [tenant.id]);

  // Auto-match spreadsheet headers to our fields (Sage, QuickBooks, Excel names all covered)
  const autoMap = (kd, cs) => {
    const n = (x)=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    const find = (pats) => cs.find(c => pats.some(p => n(c)===p)) || cs.find(c => pats.some(p => n(c).includes(p))) || "";
    const levelCols = cs.filter(c => /level|tier|price\s*\d|sales\s*price|list\s*\d|rate\s*\d/i.test(String(c)) && !/base|standard|cost/i.test(String(c)));
    if (kd === "customers") return { name: find(["customername","customer","companyname","company","displayname","client","name"]), sku:"", price:"", tier: find(["pricelevel","pricetier","tier","level","group"]), levels:[] };
    const base = find(["baseprice","unitprice","salesprice","standardprice","listprice","defaultrate","price","rate","cost"]);
    return {
      name: find(["itemname","productname","itemdescription","description","name","item","product","service","title"]),
      sku: find(["sku","itemcode","itemid","itemnumber","partnumber","productcode","code","number","id"]),
      price: base,
      tier:"",
      levels: kd==="levels" ? levelCols.filter(c=>c!==base) : [],
    };
  };

  const onFile = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    setErr("");
    try {
      const buf = await f.arrayBuffer();
      const wb = window.XLSX.read(buf,{type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rs = window.XLSX.utils.sheet_to_json(ws,{defval:null});
      if(!rs.length){ setErr("No rows found in that file. Make sure the first row has your column headers."); return; }
      const cs = Object.keys(rs[0]);
      setRows(rs); setCols(cs); setFileName(f.name); setSheetName(wb.SheetNames[0]);
      setMap(autoMap(kind, cs));
      setStep(3);
    } catch(ex){ setErr("Could not read file: "+ex.message); }
  };

  const toggleLevel = (c) => setMap(m => ({...m, levels: m.levels.includes(c) ? m.levels.filter(x=>x!==c) : [...m.levels, c]}));
  const orderedLevels = () => cols.filter(c => map.levels.includes(c));
  const num = (v) => { if(v===null||v===undefined||v==="") return null; const x=parseFloat(String(v).replace(/[$,\s]/g,"")); return isNaN(x)?NaN:x; };

  const buildReview = () => {
    const issues = []; let add=0, upd=0, skip=0;
    const seen = new Set(); const valid = [];
    rows.forEach((r,i) => {
      const line = i+2;
      const name = String(r[map.name]??"").trim();
      if(!name){ skip++; issues.push({t:"bad", m:`Row ${line}: blank name — skipped`}); return; }
      const key = kind==="customers" ? name : (map.sku ? (String(r[map.sku]??"").trim() || name) : name);
      if (seen.has(key.toLowerCase())) { skip++; issues.push({t:"warn", m:`Row ${line}: duplicate "${name}" in file — first one wins`}); return; }
      seen.add(key.toLowerCase());
      const exists = kind==="customers"
        ? existing.customers.find(c=>(c.display_name||"").toLowerCase()===name.toLowerCase())
        : existing.items.find(it => (it.sku||"")===key);
      if (kind!=="customers" && map.price) { const p=num(r[map.price]); if (p!==null && isNaN(p)) issues.push({t:"warn", m:`Row ${line}: "${name}" price "${r[map.price]}" isn't a number — will be left as-is`}); }
      if (kind==="levels") orderedLevels().forEach(c => { const p=num(r[c]); if (p!==null && isNaN(p)) issues.push({t:"warn", m:`Row ${line}: "${name}" ${c} = "${r[c]}" isn't a number — skipped for that level`}); });
      if (kind==="customers" && map.tier && r[map.tier]!=null && String(r[map.tier]).trim()!=="") {
        const t=parseInt(String(r[map.tier]).replace(/[^0-9]/g,""));
        if (t && !existing.levels.find(l=>l.rank===t)) issues.push({t:"warn", m:`Row ${line}: "${name}" tier ${t} doesn't exist yet — left unassigned (create it in Price Book first)`});
      }
      if (exists) upd++; else add++;
      valid.push(r);
    });
    setReview({ issues, add, upd, skip, total: rows.length, valid });
    setStep(4);
  };

  const runImport = async () => {
    setBusy(true); setErr("");
    try {
      let added=0, updated=0;
      if (kind === "customers") {
        const rankToId={}; existing.levels.forEach(l=>rankToId[l.rank]=l.id);
        let cur=[...existing.customers];
        for (const r of review.valid) {
          const name=String(r[map.name]??"").trim();
          const t = map.tier ? parseInt(String(r[map.tier]??"").replace(/[^0-9]/g,"")) : NaN;
          const plId = rankToId[t] || null;
          const ex=cur.find(c=>(c.display_name||"").toLowerCase()===name.toLowerCase());
          if(ex){ if(plId){ const {error}=await supabase.from("customers").update({primary_price_level_id:plId}).eq("id",ex.id); if(error) throw error; } updated++; }
          else { const {data,error}=await supabase.from("customers").insert({tenant_id:tenant.id,display_name:name,primary_price_level_id:plId,active:true}).select("id").single(); if(error) throw error; cur.push({id:data.id,display_name:name,primary_price_level_id:plId}); added++; }
        }
      } else {
        const lvCols = kind==="levels" ? orderedLevels() : [];
        let lv=[...existing.levels];
        if (lv.length < lvCols.length) {
          const toAdd=[]; for(let r=lv.length+1;r<=lvCols.length;r++) toAdd.push({tenant_id:tenant.id,name:"Price Level "+r,rank:r,mode:"percent",default_adjustment:0,active:true});
          if(toAdd.length){ const {error}=await supabase.from("price_levels").insert(toAdd); if(error) throw error; }
          const {data}=await supabase.from("price_levels").select("id,name,rank").eq("tenant_id",tenant.id).order("rank"); lv=data||[];
        }
        const rankToId={}; lv.forEach(l=>rankToId[l.rank]=l.id);
        let cur=[...existing.items];
        for (const r of review.valid) {
          const name=String(r[map.name]??"").trim();
          const sku = map.sku ? (String(r[map.sku]??"").trim() || name) : name;
          const pRaw = map.price ? num(r[map.price]) : null;
          const base = (pRaw===null||isNaN(pRaw)) ? null : pRaw;
          let itemId; const ex=cur.find(i=>(i.sku||"")===sku);
          if(ex){ itemId=ex.id; const patch={name}; if(base!==null) patch.price=base; const {error}=await supabase.from("custom_skus").update(patch).eq("id",itemId); if(error) throw error; updated++; }
          else { const {data,error}=await supabase.from("custom_skus").insert({tenant_id:tenant.id,sku,name,price:base??0,item_group:"Imported"}).select("id").single(); if(error) throw error; itemId=data.id; cur.push({id:itemId,sku,name,price:base??0}); added++; }
          if (lvCols.length) {
            const pr=[];
            lvCols.forEach((col,idx)=>{ const v=num(r[col]); if(v!==null && !isNaN(v)) pr.push({tenant_id:tenant.id,price_level_id:rankToId[idx+1],item_id:itemId,item_source:"custom",override_mode:"custom",override_value:v}); });
            if(pr.length){ const {error}=await supabase.from("price_level_items").upsert(pr,{onConflict:"price_level_id,item_source,item_id"}); if(error) throw error; }
          }
        }
      }
      setResult({ added, updated, skipped: review.skip });
      setStep(5);
    } catch(ex){ setErr("Import stopped: "+ex.message+" — rows before this point were saved; fix the file and re-import (existing rows update, they won't duplicate)."); }
    setBusy(false);
  };

  const reset = () => { setStep(1); setKind(null); setRows(null); setCols([]); setMap({name:"",sku:"",price:"",tier:"",levels:[]}); setReview(null); setResult(null); setErr(""); setFileName(""); };

  const KINDS = [
    { id:"products", t:"Products & Services", d:"Your item list with a base price — from Sage, QuickBooks, or any spreadsheet." },
    { id:"levels", t:"Price Levels", d:"Items with tiered prices, one column per level (Level 1, Level 2…). Sage 'Sales Price 1–5' works as-is." },
    { id:"customers", t:"Customers", d:"Customer names, optionally with the price tier each one gets." },
  ];
  const STEPS = ["Choose","Upload","Map","Review","Done"];
  const canMap = !!map.name && (kind!=="levels" || map.levels.length>0);
  const sample = rows ? rows.slice(0,5) : [];
  const sel = (v, on) => <select className="input" value={v} onChange={e=>on(e.target.value)}><option value="">{"— choose —"}</option>{cols.map(c=><option key={c} value={c}>{c}</option>)}</select>;

  return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">Import Center</div>
          <div className="sheet-meta">Bring in products, price levels, or customers from Sage, Excel, or CSV — guided, with a full preview before anything saves</div>
        </div>
        {step>1 && step<5 && <button className="btn btn-outline btn-sm" onClick={reset}>Start over</button>}
      </div>

      <div className="ic-steps">
        {STEPS.map((nm,i) => { const n=i+1; return (
          <div key={nm} className={`ic-step ic-${n} ${step===n?"on":""} ${step>n?"done":""}`}>
            <div className="n">{step>n ? "✓" : n}</div>{nm}
          </div>
        );})}
      </div>

      {err && <div className="ic-issue bad">{err}</div>}

      {step===1 && (
        <div>
          <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>What are you importing?</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:10}}>
            {KINDS.map(k => (
              <div key={k.id} className={`ic-choice ${kind===k.id?"sel":""}`} onClick={()=>setKind(k.id)}>
                <h4>{k.t}</h4><p>{k.d}</p>
              </div>
            ))}
          </div>
          <div style={{marginTop:14}}>
            <button className="btn btn-primary" disabled={!kind} onClick={()=>setStep(2)}>Next: upload file →</button>
          </div>
        </div>
      )}

      {step===2 && (
        <div>
          <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Upload your file</div>
          <div style={{fontSize:13,color:"var(--muted)",marginBottom:12,lineHeight:1.5}}>
            Excel (.xlsx / .xls) or CSV. The first row should be your column headers — I'll match them automatically.
            {kind==="levels" && <div style={{marginTop:6}}><b>Sage tip:</b> export your Item List with the "Sales Price 1–5" columns; each becomes a price level.</div>}
            {kind==="products" && <div style={{marginTop:6}}>Needs columns like <b>Item / Name</b>, <b>SKU</b> (optional), and <b>Price</b>.</div>}
            {kind==="customers" && <div style={{marginTop:6}}>Needs a <b>Customer / Company</b> name column, plus a <b>Tier</b> column if you assign price levels (1, 2, 3…).</div>}
          </div>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} style={{fontSize:14}}/>
          <div style={{marginTop:14}}><button className="btn-text" onClick={()=>setStep(1)}>← Back</button></div>
        </div>
      )}

      {step===3 && rows && (
        <div>
          <div className="ic-issue ok">Read <b>{rows.length}</b> rows from <b>{fileName}</b>{sheetName?` (sheet "${sheetName}")`:""}. Columns matched automatically — check them below and fix any that are off.</div>
          <div style={{fontSize:14,fontWeight:700,margin:"10px 0"}}>Match your columns</div>
          <div className="ic-map-row"><div>{kind==="customers"?"Customer name":"Item name"} <span style={{color:"var(--red)"}}>*</span></div>{sel(map.name, v=>setMap(m=>({...m,name:v})))}</div>
          {kind!=="customers" && <div className="ic-map-row"><div>SKU / item code</div>{sel(map.sku, v=>setMap(m=>({...m,sku:v})))}</div>}
          {kind!=="customers" && <div className="ic-map-row"><div>{kind==="levels"?"Base price (optional)":"Price"}</div>{sel(map.price, v=>setMap(m=>({...m,price:v})))}</div>}
          {kind==="customers" && <div className="ic-map-row"><div>Price tier (optional)</div>{sel(map.tier, v=>setMap(m=>({...m,tier:v})))}</div>}
          {kind==="levels" && (
            <div style={{margin:"10px 0"}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>Price level columns <span style={{fontWeight:400,color:"var(--muted)"}}>(check them in tier order — {map.levels.length} selected)</span></div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {cols.filter(c=>c!==map.name&&c!==map.sku).map(c => (
                  <label key={c} style={{fontSize:13,display:"flex",alignItems:"center",gap:6,border:"1px solid var(--line)",borderRadius:6,padding:"4px 8px",background:map.levels.includes(c)?"#eef4ff":"#fff",cursor:"pointer"}}>
                    <input type="checkbox" checked={map.levels.includes(c)} onChange={()=>toggleLevel(c)}/> {c}
                    {map.levels.includes(c) && <b style={{color:"#2563eb"}}>L{orderedLevels().indexOf(c)+1}</b>}
                  </label>
                ))}
              </div>
            </div>
          )}
          <div style={{fontSize:13,fontWeight:600,margin:"12px 0 6px"}}>Preview — first 5 rows exactly as they'll be read</div>
          <div style={{overflowX:"auto"}}>
            <table className="ic-prev"><thead><tr>{cols.map(c=><th key={c}>{c}</th>)}</tr></thead>
              <tbody>{sample.map((r,i)=><tr key={i}>{cols.map(c=><td key={c}>{r[c]===null?"":String(r[c])}</td>)}</tr>)}</tbody></table>
          </div>
          <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center"}}>
            <button className="btn-text" onClick={()=>setStep(2)}>← Back</button>
            <button className="btn btn-primary" disabled={!canMap} onClick={buildReview}>Next: review →</button>
          </div>
        </div>
      )}

      {step===4 && review && (
        <div>
          <div className="dash-grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))"}}>
            <div className="dash-card dash-b"><div className="lbl">Will add</div><div className="val">{review.add}</div></div>
            <div className="dash-card dash-a"><div className="lbl">Will update</div><div className="val">{review.upd}</div></div>
            <div className="dash-card dash-d"><div className="lbl">Skipped</div><div className="val">{review.skip}</div></div>
          </div>
          {review.issues.length===0
            ? <div className="ic-issue ok">✓ No problems found. Ready to import {review.valid.length} rows — nothing is saved until you click Import.</div>
            : <div>
                <div style={{fontSize:13,fontWeight:600,marginBottom:6}}>{review.issues.length} thing{review.issues.length!==1?"s":""} to know — nothing is saved yet:</div>
                <div style={{maxHeight:240,overflowY:"auto"}}>
                  {review.issues.slice(0,80).map((x,i)=><div key={i} className={`ic-issue ${x.t}`}>{x.m}</div>)}
                  {review.issues.length>80 && <div className="ic-issue warn">…and {review.issues.length-80} more</div>}
                </div>
              </div>}
          <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center"}}>
            <button className="btn-text" onClick={()=>setStep(3)}>← Back to mapping</button>
            <button className="btn btn-primary" disabled={busy||review.valid.length===0} onClick={runImport}>{busy?"Importing…":`Import ${review.valid.length} rows`}</button>
          </div>
        </div>
      )}

      {step===5 && result && (
        <div>
          <div className="ic-issue ok" style={{fontSize:14}}>✓ Import complete.</div>
          <div className="dash-grid" style={{gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))"}}>
            <div className="dash-card dash-b"><div className="lbl">Added</div><div className="val">{result.added}</div></div>
            <div className="dash-card dash-a"><div className="lbl">Updated</div><div className="val">{result.updated}</div></div>
            <div className="dash-card dash-d"><div className="lbl">Skipped</div><div className="val">{result.skipped}</div></div>
          </div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button className="btn btn-primary" onClick={reset}>Import something else</button>
            <button className="btn btn-outline" onClick={onDone}>Open Price Book →</button>
          </div>
        </div>
      )}
    </div>
  );
}

function PriceBook({ tenant }) {
  const [tab, setTab] = useState("matrix");
  const [levels, setLevels] = useState([]);
  const [items, setItems] = useState([]);
  const [cells, setCells] = useState({});
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rk, setRk] = useState(0);
  const [msg, setMsg] = useState("");
  const flash = (m) => { setMsg(m); setTimeout(()=>setMsg(""), 2800); };
  const money = n => (n==null||n==="")?"":Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

  const load = async () => {
    setLoading(true);
    const [lv, qi, cs, pli, cu] = await Promise.all([
      supabase.from("price_levels").select("id,name,rank").eq("tenant_id",tenant.id).order("rank"),
      supabase.from("qbo_items").select("id,sku,name,price").eq("tenant_id",tenant.id),
      supabase.from("custom_skus").select("id,sku,name,price").eq("tenant_id",tenant.id),
      supabase.from("price_level_items").select("price_level_id,item_id,override_value").eq("tenant_id",tenant.id),
      supabase.from("customers").select("id,display_name,primary_price_level_id").eq("tenant_id",tenant.id).order("display_name"),
    ]);
    setLevels(lv.data||[]); setCustomers(cu.data||[]);
    const its=[...(qi.data||[]).map(x=>({...x,source:"qbo"})), ...(cs.data||[]).map(x=>({...x,source:"custom"}))].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
    setItems(its);
    const c={}; (pli.data||[]).forEach(p=>{ (c[p.item_id]=c[p.item_id]||{})[p.price_level_id]=p.override_value; }); setCells(c);
    setRk(x=>x+1); setLoading(false);
  };
  useEffect(()=>{ load(); }, [tenant.id]);

  const saveCell = async (item, plId, val) => {
    const raw = String(val).trim().replace(/[^0-9.\-]/g,"");
    if (raw==="") {
      await supabase.from("price_level_items").delete().match({price_level_id:plId,item_id:item.id,item_source:item.source});
      setCells(c=>{ const n={...c}; if(n[item.id]){ n[item.id]={...n[item.id]}; delete n[item.id][plId]; } return n; });
    } else {
      const v=parseFloat(raw);
      await supabase.from("price_level_items").upsert({tenant_id:tenant.id,price_level_id:plId,item_id:item.id,item_source:item.source,override_mode:"custom",override_value:v},{onConflict:"price_level_id,item_source,item_id"});
      setCells(c=>({...c,[item.id]:{...(c[item.id]||{}),[plId]:v}}));
    }
    flash("Saved");
  };
  const saveBase = async (item, val) => {
    const v=parseFloat(String(val).replace(/[^0-9.\-]/g,""))||0;
    await supabase.from(item.source==="qbo"?"qbo_items":"custom_skus").update({price:v}).eq("id",item.id);
    setItems(its=>its.map(i=>i.id===item.id?{...i,price:v}:i)); flash("Base saved");
  };
  const setTier = async (custId, plId) => {
    const v = plId || null;
    await supabase.from("customers").update({primary_price_level_id:v}).eq("id",custId);
    setCustomers(cs=>cs.map(c=>c.id===custId?{...c,primary_price_level_id:v}:c)); flash("Tier updated");
  };

  // ---- bulk price adjust ----
  const [adjDir, setAdjDir] = useState("raise");
  const [adjMode, setAdjMode] = useState("amount");
  const [adjVal, setAdjVal] = useState("");
  const [adjBase, setAdjBase] = useState(true);
  const [adjTiers, setAdjTiers] = useState(true);
  const [adjBusy, setAdjBusy] = useState(false);
  const applyAdjust = async () => {
    const v = parseFloat(String(adjVal).replace(/[^0-9.]/g,""));
    if (!v || v<=0) { flash("Enter an amount greater than 0"); return; }
    if (!adjBase && !adjTiers) { flash("Choose base prices, tier prices, or both"); return; }
    const sign = adjDir==="lower" ? -1 : 1;
    const adj = (n) => { const cur=Number(n)||0; let out = adjMode==="percent" ? cur*(1+sign*v/100) : cur+sign*v; out=Math.round(out*100)/100; return out<0?0:out; };
    const baseCount = adjBase ? items.length : 0;
    let tierCount = 0;
    if (adjTiers) items.forEach(it => levels.forEach(l => { if (cells[it.id] && cells[it.id][l.id]!=null) tierCount++; }));
    const parts = [];
    if (adjBase) parts.push(baseCount+" base price"+(baseCount!==1?"s":""));
    if (adjTiers) parts.push(tierCount+" tier price"+(tierCount!==1?"s":""));
    const amt = adjMode==="percent" ? v+"%" : "$"+v.toFixed(2);
    if (!window.confirm((adjDir==="lower"?"Lower ":"Raise ")+parts.join(" and ")+" by "+amt+"?\n\nThis can't be undone.")) return;
    setAdjBusy(true);
    try {
      if (adjBase) {
        for (const it of items) {
          await supabase.from(it.source==="qbo"?"qbo_items":"custom_skus").update({price:adj(it.price)}).eq("id", it.id);
        }
      }
      if (adjTiers) {
        const rows = [];
        items.forEach(it => levels.forEach(l => {
          const cur = cells[it.id] && cells[it.id][l.id];
          if (cur!=null) rows.push({ tenant_id:tenant.id, price_level_id:l.id, item_id:it.id, item_source:it.source, override_mode:"custom", override_value:adj(cur) });
        }));
        for (let i=0;i<rows.length;i+=200) { const chunk=rows.slice(i,i+200); if (chunk.length) await supabase.from("price_level_items").upsert(chunk,{onConflict:"price_level_id,item_source,item_id"}); }
      }
      flash("Prices updated"); setAdjVal(""); await load(); setTab("matrix");
    } catch(err) { flash("Adjust error: "+err.message); }
    setAdjBusy(false);
  };

  // ---- import ----
  const [impRows, setImpRows] = useState(null);
  const [impCols, setImpCols] = useState([]);
  const [impKind, setImpKind] = useState("items");
  const [mName, setMName] = useState(""); const [mSku, setMSku] = useState(""); const [mBase, setMBase] = useState("");
  const [mLevels, setMLevels] = useState([]);
  const [mCustName, setMCustName] = useState(""); const [mCustTier, setMCustTier] = useState("");
  const [busy, setBusy] = useState(false);

  const onFile = async (e) => {
    const f = e.target.files[0]; if(!f) return;
    try {
      const buf = await f.arrayBuffer();
      const wb = window.XLSX.read(buf,{type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = window.XLSX.utils.sheet_to_json(ws,{defval:null});
      if(!rows.length){ flash("No rows found in that file"); return; }
      setImpRows(rows); setImpCols(Object.keys(rows[0]));
      setMName(""); setMSku(""); setMBase(""); setMLevels([]); setMCustName(""); setMCustTier("");
    } catch(err){ flash("Could not read file: "+err.message); }
  };
  const toggleLevel = (col) => setMLevels(ls => ls.includes(col) ? ls.filter(x=>x!==col) : [...ls, col]);
  const orderedLevels = () => impCols.filter(c => mLevels.includes(c));

  const runItemImport = async () => {
    if(!mName || mLevels.length===0){ flash("Pick the item-name column and at least one price column"); return; }
    setBusy(true);
    try {
      const cols = orderedLevels();
      let lv = levels;
      if(lv.length < cols.length){
        const toAdd=[];
        for(let r=lv.length+1; r<=cols.length; r++) toAdd.push({tenant_id:tenant.id,name:"Price Level "+r,rank:r,mode:"percent",default_adjustment:0,active:true});
        if(toAdd.length) await supabase.from("price_levels").insert(toAdd);
        const {data}=await supabase.from("price_levels").select("id,name,rank").eq("tenant_id",tenant.id).order("rank"); lv=data||[];
      }
      const rankToId={}; lv.forEach(l=>rankToId[l.rank]=l.id);
      let cur=[...items]; let n=0;
      for(const row of impRows){
        const name=String(row[mName]??"").trim(); if(!name) continue;
        const sku=mSku?String(row[mSku]??"").trim():name;
        const base=mBase?(parseFloat(row[mBase])||0):0;
        let itemId; const ex=cur.find(i=>i.sku===sku);
        if(ex){ itemId=ex.id; await supabase.from("custom_skus").update({name,price:base}).eq("id",itemId); }
        else { const {data,error}=await supabase.from("custom_skus").insert({tenant_id:tenant.id,sku,name,price:base,item_group:"Imported"}).select("id").single(); if(error) throw error; itemId=data.id; cur.push({id:itemId,sku,name,price:base}); }
        const pr=[];
        cols.forEach((col,idx)=>{ const v=row[col]; if(v!==null&&v!==""&&!isNaN(parseFloat(v))) pr.push({tenant_id:tenant.id,price_level_id:rankToId[idx+1],item_id:itemId,item_source:"custom",override_mode:"custom",override_value:parseFloat(v)}); });
        if(pr.length) await supabase.from("price_level_items").upsert(pr,{onConflict:"price_level_id,item_source,item_id"});
        n++;
      }
      flash("Imported "+n+" items"); setImpRows(null); await load(); setTab("matrix");
    } catch(err){ flash("Import error: "+err.message); }
    setBusy(false);
  };

  const runCustomerImport = async () => {
    if(!mCustName || !mCustTier){ flash("Pick the customer-name and tier columns"); return; }
    setBusy(true);
    try {
      const rankToId={}; levels.forEach(l=>rankToId[l.rank]=l.id);
      let cur=[...customers]; let n=0;
      for(const row of impRows){
        const name=String(row[mCustName]??"").trim(); if(!name) continue;
        const tierNum=parseInt(String(row[mCustTier]??"").replace(/[^0-9]/g,""));
        const plId=rankToId[tierNum]||null;
        const ex=cur.find(c=>(c.display_name||"").toLowerCase()===name.toLowerCase());
        if(ex){ await supabase.from("customers").update({primary_price_level_id:plId}).eq("id",ex.id); }
        else { const {data,error}=await supabase.from("customers").insert({tenant_id:tenant.id,display_name:name,primary_price_level_id:plId,active:true}).select("id").single(); if(error) throw error; cur.push({id:data.id,display_name:name,primary_price_level_id:plId}); }
        n++;
      }
      flash("Imported "+n+" customers"); setImpRows(null); await load(); setTab("customers");
    } catch(err){ flash("Import error: "+err.message); }
    setBusy(false);
  };

  return (
    <div className="sheet">
      <div className="sheet-h">
        <div>
          <div className="sheet-title">Price Book</div>
          <div className="sheet-meta">{items.length} items · {levels.length} levels · {customers.length} customers</div>
        </div>
      </div>
      {msg && <div style={{background:"#eef6f1",border:"1px solid #2ca01c",borderRadius:6,padding:"8px 12px",marginBottom:12,fontSize:13}}>{msg}</div>}
      <div style={{display:"flex",gap:6,marginBottom:14}}>
        {["matrix","customers","adjust","import"].map(t=>(
          <button key={t} onClick={()=>setTab(t)}
            style={{flex:1,padding:"9px 4px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",textTransform:"capitalize",fontFamily:"inherit",background:tab===t?"var(--ink)":"#fff",color:tab===t?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>{t}</button>
        ))}
      </div>

      {loading ? <div style={{padding:30,textAlign:"center",color:"var(--muted)"}}>Loading…</div> : (<>

      {tab==="matrix" && (
        (levels.length===0 || items.length===0) ? (
          <div style={{padding:24,textAlign:"center",color:"var(--muted)"}}>No price data yet. Use the <b>Import</b> tab to load your list.</div>
        ) : (
        <div style={{overflow:"auto",border:"1px solid var(--line)",borderRadius:8,maxHeight:"64vh"}}>
          <table key={rk} style={{borderCollapse:"separate",borderSpacing:0,fontSize:13}}>
            <thead><tr>
              <th style={{position:"sticky",left:0,top:0,zIndex:6,background:"#fafaf6",padding:8,textAlign:"left",borderBottom:"1px solid var(--line)",borderRight:"1px solid var(--line)"}}>Item</th>
              {levels.map(l=>(<th key={l.id} style={{position:"sticky",top:0,background:"#fafaf6",padding:"8px 6px",fontSize:11,color:"var(--muted)",borderBottom:"1px solid var(--line)",borderRight:"1px solid var(--line)",whiteSpace:"nowrap"}}>{l.name.replace("Price Level","PL")}</th>))}
            </tr></thead>
            <tbody>
              {items.map(it=>(
                <tr key={it.id}>
                  <td style={{position:"sticky",left:0,zIndex:1,background:"#fff",padding:"6px 8px",borderBottom:"1px solid #eee",borderRight:"1px solid var(--line)",minWidth:150}}>
                    <div style={{fontWeight:600,whiteSpace:"nowrap"}}>{it.name}</div>
                    <div style={{fontSize:10,color:"var(--muted)"}}>{it.sku} · base <input defaultValue={money(it.price)} onBlur={e=>saveBase(it,e.target.value)} inputMode="decimal" style={{width:54,border:"1px solid #eee",borderRadius:4,fontSize:11,textAlign:"right",fontFamily:"monospace",padding:"1px 3px"}}/></div>
                  </td>
                  {levels.map(l=>(
                    <td key={l.id} style={{borderBottom:"1px solid #eee",borderRight:"1px solid var(--line)"}}>
                      <input defaultValue={cells[it.id]&&cells[it.id][l.id]!=null?money(cells[it.id][l.id]):""} placeholder="·"
                        onBlur={e=>saveCell(it,l.id,e.target.value)} inputMode="decimal"
                        style={{width:62,border:"1px solid transparent",background:"transparent",fontFamily:"monospace",fontSize:13,textAlign:"right",padding:"7px 5px"}}/>
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        )
      )}

      {tab==="customers" && (
        customers.length===0 ? <div style={{padding:24,textAlign:"center",color:"var(--muted)"}}>No customers yet. Load them in the <b>Import</b> tab.</div> :
        <div style={{border:"1px solid var(--line)",borderRadius:8,overflow:"hidden"}}>
          {customers.map(c=>(
            <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 12px",borderBottom:"1px solid #eee",gap:8}}>
              <span style={{fontSize:14,fontWeight:500}}>{c.display_name}</span>
              <select value={c.primary_price_level_id||""} onChange={e=>setTier(c.id, e.target.value||null)} style={{padding:"6px 8px",border:"1px solid var(--line)",borderRadius:6,fontSize:13}}>
                <option value="">Untiered</option>
                {levels.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
              </select>
            </div>
          ))}
        </div>
      )}

      {tab==="adjust" && (
        <div>
          <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:12}}>Raise or lower every price at once — by a flat amount or a percent. Pick whether it touches your base list prices, your tier (price-level) prices, or both.</div>

          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <button onClick={()=>setAdjDir("raise")} style={{flex:1,padding:"9px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",background:adjDir==="raise"?"var(--go)":"#fff",color:adjDir==="raise"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>▲ Raise</button>
            <button onClick={()=>setAdjDir("lower")} style={{flex:1,padding:"9px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",background:adjDir==="lower"?"var(--red)":"#fff",color:adjDir==="lower"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>▼ Lower</button>
          </div>

          <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <div className="label" style={{marginBottom:4}}>{adjMode==="percent"?"Percent":"Amount per item"}</div>
              <input className="input" inputMode="decimal" value={adjVal} onChange={e=>setAdjVal(e.target.value)} placeholder={adjMode==="percent"?"e.g. 3":"e.g. 0.25"}/>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setAdjMode("amount")} style={{padding:"10px 14px",borderRadius:7,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:adjMode==="amount"?"var(--ink)":"#fff",color:adjMode==="amount"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>$</button>
              <button onClick={()=>setAdjMode("percent")} style={{padding:"10px 14px",borderRadius:7,fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit",background:adjMode==="percent"?"var(--ink)":"#fff",color:adjMode==="percent"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>%</button>
            </div>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
            <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}}>
              <input type="checkbox" checked={adjBase} onChange={e=>setAdjBase(e.target.checked)}/>
              Base list prices <span style={{color:"var(--muted)"}}>({items.length} items)</span>
            </label>
            <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,cursor:"pointer"}}>
              <input type="checkbox" checked={adjTiers} onChange={e=>setAdjTiers(e.target.checked)}/>
              Tier prices <span style={{color:"var(--muted)"}}>(every filled cell in the matrix)</span>
            </label>
          </div>

          <button className="btn btn-primary" disabled={adjBusy} onClick={applyAdjust} style={{width:"100%"}}>
            {adjBusy ? "Applying…" : (adjDir==="lower"?"Lower":"Raise")+" prices"}
          </button>
          <div style={{fontSize:11,color:"var(--muted)",marginTop:8,textAlign:"center"}}>You'll get a confirmation with the exact count before anything changes. No bulk undo.</div>
        </div>
      )}

      {tab==="import" && (
        <div>
          <div style={{display:"flex",gap:6,marginBottom:12}}>
            <button onClick={()=>{setImpKind("items");setImpRows(null);}} style={{flex:1,padding:"9px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",background:impKind==="items"?"var(--brass)":"#fff",color:impKind==="items"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>Items &amp; Prices</button>
            <button onClick={()=>{setImpKind("customers");setImpRows(null);}} style={{flex:1,padding:"9px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",background:impKind==="customers"?"var(--brass)":"#fff",color:impKind==="customers"?"#fff":"var(--ink)",border:"1px solid var(--line)"}}>Customers &amp; Tiers</button>
          </div>
          <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:10}}>Upload an Excel (.xlsx) or CSV from Sage, QuickBooks, or any spreadsheet. You map the columns yourself, so any layout works. Existing items/customers are matched and updated, not duplicated.</div>
          <input type="file" accept=".xlsx,.xls,.csv" onChange={onFile} style={{marginBottom:14,fontSize:13,display:"block"}}/>

          {impRows && (
            <div style={{background:"#fafaf6",border:"1px solid var(--line)",borderRadius:8,padding:12}}>
              <div style={{fontSize:12,color:"var(--muted)",marginBottom:10}}>{impRows.length} rows · {impCols.length} columns found</div>

              {impKind==="items" ? (<>
                <Field label="Item name column"><select value={mName} onChange={e=>setMName(e.target.value)} className="input"><option value="">— choose —</option>{impCols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
                <Field label="SKU / ID column (optional)"><select value={mSku} onChange={e=>setMSku(e.target.value)} className="input"><option value="">— use name as SKU —</option>{impCols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
                <Field label="Base / list price column (optional)"><select value={mBase} onChange={e=>setMBase(e.target.value)} className="input"><option value="">— none —</option>{impCols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
                <div style={{fontSize:13,fontWeight:600,margin:"10px 0 6px"}}>Price level columns <span style={{fontWeight:400,color:"var(--muted)"}}>(check in tier order — {mLevels.length} selected)</span></div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>
                  {impCols.map(c=>(
                    <label key={c} style={{fontSize:12,padding:"5px 8px",border:"1px solid var(--line)",borderRadius:6,background:mLevels.includes(c)?"#eef6f1":"#fff",cursor:"pointer"}}>
                      <input type="checkbox" checked={mLevels.includes(c)} onChange={()=>toggleLevel(c)} style={{marginRight:5}}/>{c}
                    </label>
                  ))}
                </div>
                <button className="btn btn-primary" disabled={busy} onClick={runItemImport} style={{width:"100%"}}>{busy?"Importing…":"Import Items & Prices"}</button>
              </>) : (<>
                <Field label="Customer name column"><select value={mCustName} onChange={e=>setMCustName(e.target.value)} className="input"><option value="">— choose —</option>{impCols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
                <Field label="Tier column (a number 1–N)"><select value={mCustTier} onChange={e=>setMCustTier(e.target.value)} className="input"><option value="">— choose —</option>{impCols.map(c=><option key={c} value={c}>{c}</option>)}</select></Field>
                <button className="btn btn-primary" disabled={busy} onClick={runCustomerImport} style={{width:"100%",marginTop:4}}>{busy?"Importing…":"Import Customers & Tiers"}</button>
              </>)}
            </div>
          )}
        </div>
      )}

      </>)}
    </div>
  );
}

function Settings({ tenant, user, userRole, qboConnected, settings, onClose, onQboChange, onSettingsChange }) {
  const [syncing, setSyncing] = useState(false);
  const [itemCount, setItemCount] = useState(0);
  const [custCount, setCustCount] = useState(0);
  const [syncingCust, setSyncingCust] = useState(false);
  const [lastSync, setLastSync] = useState("");
  const [hideRates, setHideRates] = useState(!!settings?.hide_rates_from_techs);
  const [savingSetting, setSavingSetting] = useState(false);
  const [printerEmail, setPrinterEmail] = useState(settings?.printer_email || "");
  const [savingPrinter, setSavingPrinter] = useState(false);
  const isAdmin = userRole === "owner" || userRole === "admin";

  useEffect(() => {
    loadItemCount();
    loadCustCount();
    const handler = (e) => {
      if (e.data?.type === "qbo-connected") {
        onQboChange();
        if (e.data.success) {
          // Auto-sync products immediately after connect
          setTimeout(() => autoSyncAfterConnect(), 1000);
        }
      }
    };
    window.addEventListener("message", handler);
    return () => window.removeEventListener("message", handler);
  }, []);

  const loadItemCount = async () => {
    const { count, data } = await supabase.from("qbo_items")
      .select("synced_at", { count: "exact" })
      .eq("tenant_id", tenant.id)
      .order("synced_at", { ascending: false })
      .limit(1);
    setItemCount(count || 0);
    if (data?.[0]?.synced_at) setLastSync(new Date(data[0].synced_at).toLocaleString());
  };

  const loadCustCount = async () => {
    const { count } = await supabase.from("customers")
      .select("id", { count: "exact", head: true })
      .eq("tenant_id", tenant.id);
    setCustCount(count || 0);
  };

  const connectQbo = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-auth?tenant_id=${tenant.id}`, {
        headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      const w = window.open(data.url, "qbo-oauth", "width=600,height=700");
      if (!w) alert("Please allow popups to connect QuickBooks");
    } catch (e) {
      alert(`Failed to start QBO connection: ${e.message}`);
    }
  };

  const autoSyncAfterConnect = async () => {
    setSyncing(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-list-items`, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ tenant_id: tenant.id }),
      });
      const data = await res.json();
      if (data.success) {
        alert(`✅ QuickBooks connected!\n\n📦 Auto-synced ${data.count} products from your QBO account.`);
        loadItemCount();
      } else {
        alert(`✅ QuickBooks connected!\n\nProduct sync failed: ${data.error}\nYou can re-sync manually below.`);
      }
    } catch (e) {
      alert(`✅ QuickBooks connected!\n\nProduct sync failed: ${e.message}`);
    }
    setSyncing(false);
  };

  const disconnectQbo = async () => {
    if (!confirm("Disconnect QuickBooks? You can reconnect anytime.")) return;
    await supabase.from("qbo_tokens").delete().eq("tenant_id", tenant.id);
    onQboChange();
    alert("QuickBooks disconnected.");
  };

  const syncItems = async () => {
    setSyncing(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-list-items`, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ tenant_id: tenant.id }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      alert(`✅ Synced ${data.count} products from QuickBooks`);
      loadItemCount();
    } catch (e) {
      alert(`Sync failed: ${e.message}`);
    }
    setSyncing(false);
  };

  const syncCustomers = async () => {
    setSyncingCust(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/qbo-list-customers`, {
        method: "POST",
        headers: { "Content-Type":"application/json", "apikey":SUPABASE_KEY, "Authorization":`Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({ tenant_id: tenant.id }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      alert(`✅ Synced ${data.count} customers from QuickBooks`);
      loadCustCount();
    } catch (e) {
      alert(`Customer sync failed: ${e.message}`);
    }
    setSyncingCust(false);
  };

  const toggleHideRates = async () => {
    const newVal = !hideRates;
    setSavingSetting(true);
    try {
      const { error } = await supabase.from("tenant_settings")
        .update({ hide_rates_from_techs: newVal, updated_at: new Date().toISOString() })
        .eq("tenant_id", tenant.id);
      if (error) throw error;
      setHideRates(newVal);
      onSettingsChange();
    } catch (e) {
      alert(`Could not save: ${e.message}`);
    }
    setSavingSetting(false);
  };

  const savePrinter = async () => {
    setSavingPrinter(true);
    try {
      const { error } = await supabase.from("tenant_settings")
        .update({ printer_email: printerEmail.trim() || null, updated_at: new Date().toISOString() })
        .eq("tenant_id", tenant.id);
      if (error) throw error;
      onSettingsChange();
      alert("✅ Printer email saved");
    } catch (e) {
      alert(`Could not save: ${e.message}`);
    }
    setSavingPrinter(false);
  };

  const subscribe = (planId) => {
    const link = STRIPE_LINKS[planId];
    if (!link) { alert("That plan isn't set up yet."); return; }
    const url = link + (link.includes("?") ? "&" : "?") + "client_reference_id=" + encodeURIComponent(tenant.id);
    window.open(url, "_blank");
  };

  const trialDays = tenant.trial_ends_at
    ? Math.max(0, Math.ceil((new Date(tenant.trial_ends_at) - Date.now()) / (1000*60*60*24)))
    : 0;

  const planLabel = PLANS.find(p=>p.id===tenant.plan)?.name || tenant.plan;
  const planPrice = PLANS.find(p=>p.id===tenant.plan)?.price || "—";

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">
          <h2>Settings</h2>
          <button className="btn-icon" style={{color:"var(--muted)",fontSize:18}} onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">

          <div className="settings-section">
            <div className="settings-h">Company</div>
            <div className="kv-row"><span className="k">Name</span><span className="v">{tenant.name}</span></div>
            <div className="kv-row"><span className="k">Industry</span><span className="v">{tenant.industry}</span></div>
            <div className="kv-row"><span className="k">Owner</span><span className="v">{tenant.owner_email}</span></div>
            <div className="kv-row"><span className="k">Your role</span><span className="v" style={{textTransform:"capitalize"}}>{userRole}</span></div>
          </div>

          <div className="settings-section">
            <div className="settings-h">Subscription</div>
            <div className="kv-row"><span className="k">Plan</span><span className="v">{planLabel} — ${planPrice}/mo</span></div>
            <div className="kv-row"><span className="k">Status</span><span className="v" style={{textTransform:"capitalize"}}>
              {(!["active","past_due","canceled"].includes(tenant.subscription_status) && trialDays > 0) ? `Free trial — ${trialDays} days left` : (tenant.subscription_status || "Trial ended")}
            </span></div>
            {isAdmin && (
              <div style={{marginTop:12}}>
                <div className="settings-sub">Subscribe or change plan:</div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {PLANS.filter(pl => STRIPE_LINKS[pl.id]).map((pl, _i, arr) => (
                    <button key={pl.id} className="btn btn-primary btn-sm" onClick={()=>subscribe(pl.id)}>
                      {arr.length > 1 ? `${pl.name} — $${pl.price}/mo` : `Subscribe — $${pl.price}/mo`}
                    </button>
                  ))}
                </div>
                {STRIPE_PORTAL_URL && (
                  <a className="btn-text" href={STRIPE_PORTAL_URL} target="_blank" rel="noopener noreferrer" style={{display:"inline-block",marginTop:10}}>Manage billing →</a>
                )}
              </div>
            )}
          </div>

          {isAdmin && (
            <div className="settings-section">
              <div className="settings-h">Pricing Visibility</div>
              <div className="settings-sub">Control whether technicians can see rates and totals on work orders.</div>
              <label style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",background:"#fafaf6",borderRadius:6,cursor:"pointer"}}>
                <input type="checkbox" checked={hideRates} onChange={toggleHideRates} disabled={savingSetting} style={{width:18,height:18,cursor:"pointer"}}/>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>Hide rates from technicians</div>
                  <div style={{fontSize:11,color:"var(--muted)"}}>Techs won't see Rate, Amount, or Totals columns. Owners and admins still see all pricing.</div>
                </div>
              </label>
            </div>
          )}

          {isAdmin && (
            <div className="settings-section">
              <div className="settings-h">Printing</div>
              <div className="settings-sub">Where the Print button sends work orders. Enter your printer's email address — for example an HP ePrint address. Leave blank and the Print button will prompt you to set it.</div>
              <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                <div style={{flex:1}}>
                  <label className="label">Printer email</label>
                  <input className="input" type="email" value={printerEmail} onChange={e=>setPrinterEmail(e.target.value)} placeholder="yourprinter@hpeprint.com"/>
                </div>
                <button className="btn btn-primary btn-sm" onClick={savePrinter} disabled={savingPrinter}>{savingPrinter?"Saving…":"Save"}</button>
              </div>
            </div>
          )}

          {isAdmin && <TeamSection tenant={tenant} currentUserId={user.id}/>}

          <div className="settings-section">
            <div className="settings-h">QuickBooks Online</div>
            <div className="settings-sub">Connect your QBO company to create invoices from work orders. Products auto-sync on first connect.</div>
            <div className="qbo-status-card">
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={{width:10,height:10,borderRadius:"50%",background:qboConnected?"var(--qb)":"#bdc3c7",boxShadow:qboConnected?"0 0 6px rgba(44,160,28,0.6)":"none"}}/>
                <span style={{fontWeight:700,fontSize:14}}>{qboConnected ? "Connected" : "Not connected"}</span>
              </div>
              {qboConnected && itemCount > 0 && (
                <div style={{fontSize:12,color:"var(--muted)"}}>
                  📦 {itemCount} products synced{lastSync && ` · Last sync: ${lastSync}`}
                </div>
              )}
              {qboConnected && custCount > 0 && (
                <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>
                  👥 {custCount} customers synced
                </div>
              )}
            </div>
            <div className="btn-row">
              {!qboConnected ? (
                <button className="btn btn-primary btn-sm" onClick={connectQbo}>Connect QuickBooks</button>
              ) : (
                <>
                  <button className="btn btn-outline btn-sm" onClick={syncItems} disabled={syncing}>
                    {syncing ? "Syncing…" : itemCount > 0 ? "🔄 Re-sync Products" : "📥 Sync Products"}
                  </button>
                  <button className="btn btn-outline btn-sm" onClick={syncCustomers} disabled={syncingCust}>
                    {syncingCust ? "Syncing…" : custCount > 0 ? "🔄 Re-sync Customers" : "📥 Sync Customers"}
                  </button>
                  {isAdmin && <button className="btn-text" onClick={disconnectQbo} style={{color:"var(--red)"}}>Disconnect</button>}
                </>
              )}
            </div>
          </div>

          <div className="settings-section">
            <div className="settings-h">Help & Support</div>
            <div className="settings-sub">Need help? Get in touch with us directly.</div>
            <div style={{padding:"12px 14px", background:"#fafaf6", borderRadius:6, marginBottom:8}}>
              <div style={{fontSize:13, marginBottom:6}}>
                📧 <a href="mailto:rodney@prompted2dothis.com" style={{color:"var(--inv)", fontWeight:600}}>rodney@prompted2dothis.com</a>
              </div>
              <div style={{fontSize:11, color:"var(--muted)", marginTop:6}}>
                Response within 24 hours during business days.
              </div>
            </div>
          </div>

          <div className="settings-section">
            <div className="settings-h">Coming Soon</div>
            <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.7}}>
              ✓ Team members & PIN authentication<br/>
              ✓ Custom service catalog editor<br/>
              ✓ Email templates & default rates<br/>
              ✓ Customer & technician lists<br/>
              {(tenant.plan === "gps" || tenant.plan === "pro") && <><br/>🚛 GPS truck tracking (v2)</>}
              {tenant.plan === "pro" && <><br/>💰 Price Levels for QBO integration (v3)</>}
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
