<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>P2 Price Book Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --violet-deep: #1c1030;
    --violet: #4c2a85;
    --violet-bright: #7c4dff;
    --violet-soft: #b39ddb;
    --card: #2b1b46;
    --card-edge: #3d2a5e;
    --text: #f2eefa;
    --text-dim: #a99cc4;
    --green: #4cd97b;
    --amber: #ffb84d;
    --red: #ff6b6b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--violet-deep) 0%, #120a20 100%);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    padding: 18px 16px 14px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--card-edge);
  }
  .p2-badge {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #6a3bd8, #3b1f70);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #fff;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header .sub { font-size: 12px; color: var(--text-dim); }
  header .spacer { flex: 1; }
  #signOutBtn {
    background: none; border: 1px solid var(--card-edge); color: var(--text-dim);
    padding: 6px 12px; border-radius: 8px; font-size: 13px;
  }

  /* Tabs */
  .tabs { display: flex; margin: 14px 16px 0; background: #1a0f2e; border-radius: 12px; padding: 4px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600;
    color: var(--text-dim); border-radius: 9px; border: none; background: none;
  }
  .tab.active { background: var(--violet); color: #fff; }

  .panel { padding: 16px; display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--card-edge);
    border-radius: 14px; padding: 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: var(--violet-soft); text-transform: uppercase; letter-spacing: 0.06em; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
  input, select {
    width: 100%; padding: 12px; border-radius: 10px; font-size: 16px;
    background: #1a0f2e; border: 1px solid var(--card-edge); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: 2px solid var(--violet-bright); outline-offset: 0; border-color: transparent; }

  button.primary {
    width: 100%; margin-top: 14px; padding: 14px; border: none; border-radius: 12px;
    background: linear-gradient(135deg, #7c4dff, #5a2ea6); color: #fff;
    font-size: 16px; font-weight: 700;
  }
  button.primary:active { opacity: 0.85; }
  button:disabled { opacity: 0.5; }

  /* Lists */
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 0; border-bottom: 1px solid var(--card-edge);
  }
  .row:last-child { border-bottom: none; }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .row select.lvl { width: auto; padding: 8px 10px; font-size: 13px; }

  .price-pill {
    background: #1a0f2e; border: 1px solid var(--card-edge); border-radius: 10px;
    padding: 8px 12px; font-size: 15px; font-weight: 700; min-width: 84px; text-align: right;
  }
  .price-pill.base { color: var(--text-dim); font-weight: 500; }
  .price-edit { display: none; align-items: center; gap: 6px; }
  .price-edit input { width: 92px; text-align: right; padding: 8px; font-size: 15px; }
  .price-edit button {
    padding: 8px 12px; border-radius: 9px; border: none; font-size: 13px; font-weight: 700;
  }
  .price-edit .save { background: var(--green); color: #10241a; }
  .price-edit .cancel { background: none; color: var(--text-dim); }
  .row.editing .price-pill { display: none; }
  .row.editing .price-edit { display: flex; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #2b1b46; border: 1px solid var(--violet-bright); color: var(--text);
    padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
    transition: transform 0.25s ease; z-index: 99; max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--red); }

  /* Sign in */
  #authView { padding: 40px 24px; max-width: 380px; margin: 0 auto; }
  #authView .p2-badge { width: 56px; height: 56px; font-size: 24px; border-radius: 14px; margin: 0 auto 16px; }
  #authView h1 { text-align: center; font-size: 20px; margin-bottom: 4px; }
  #authView p { text-align: center; font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }

  .hidden { display: none !important; }
  .searchbox { margin-bottom: 4px; }
  .empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>

<!-- SIGN IN -->
<div id="authView" class="hidden">
  <div class="p2-badge">p2</div>
  <h1>Price Book Admin</h1>
  <p>Sign in with your P2 Invoicing account</p>
  <label>Email</label>
  <input type="email" id="authEmail" autocomplete="username" inputmode="email">
  <label>Password</label>
  <input type="password" id="authPass" autocomplete="current-password">
  <button class="primary" id="signInBtn">Sign in</button>
</div>

<!-- APP -->
<div id="appView" class="hidden">
  <header>
    <div class="p2-badge">p2</div>
    <div>
      <h1>Price Book Admin</h1>
      <div class="sub" id="tenantName"></div>
    </div>
    <div class="spacer"></div>
    <button id="signOutBtn">Sign out</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="customers">Customers</button>
    <button class="tab" data-tab="pricing">Pricing</button>
  </div>

  <!-- CUSTOMERS -->
  <div class="panel active" id="panel-customers">
    <div class="card">
      <h2>Add customer</h2>
      <label>Name *</label>
      <input id="custName" placeholder="Customer or company name">
      <label>Email</label>
      <input id="custEmail" inputmode="email" placeholder="optional">
      <label>Phone</label>
      <input id="custPhone" inputmode="tel" placeholder="optional">
      <label>Address</label>
      <input id="custAddress" placeholder="optional">
      <label>Price level</label>
      <select id="custLevel"></select>
      <button class="primary" id="addCustBtn">Add customer</button>
    </div>
    <div class="card">
      <h2>Customers</h2>
      <input class="searchbox" id="custSearch" placeholder="Search customers…">
      <div id="custList"><div class="empty">Loading…</div></div>
    </div>
  </div>

  <!-- PRICING -->
  <div class="panel" id="panel-pricing">
    <div class="card">
      <h2>Price level</h2>
      <select id="priceLevelSelect"></select>
    </div>
    <div class="card">
      <h2>Item prices</h2>
      <input class="searchbox" id="itemSearch" placeholder="Search items…">
      <div id="itemList"><div class="empty">Pick a price level</div></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = "https://attneiceahozrxiiybis.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0dG5laWNlYWhvenJ4aWl5YmlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNjUzMjksImV4cCI6MjA5Nzg0MTMyOX0.59Ln0cxUtmRT51L1jgKZcB5jceN53DatH3rRtx64tKg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let tenantId = null;
let priceLevels = [];   // {id, name, rank}
let items = [];         // qbo_items {id, name, sku, price}
let customers = [];     // {id, display_name, ...}
let levelPrices = {};   // item_id -> {pliId, value} for selected level

const $ = (id) => document.getElementById(id);

function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = isErr ? "show err" : "show";
  setTimeout(() => t.className = "", 2600);
}
const money = (v) => "$" + Number(v).toFixed(2);

// ---------- AUTH ----------
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { showApp(); } else { $("authView").classList.remove("hidden"); }
}

$("signInBtn").onclick = async () => {
  $("signInBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: $("authEmail").value.trim(),
    password: $("authPass").value
  });
  $("signInBtn").disabled = false;
  if (error) return toast(error.message, true);
  $("authView").classList.add("hidden");
  showApp();
};

$("signOutBtn").onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

async function showApp() {
  $("appView").classList.remove("hidden");
  const { data: { user } } = await sb.auth.getUser();
  const { data: tu, error } = await sb.from("tenant_users")
    .select("tenant_id, tenants(name)")
    .eq("user_id", user.id).limit(1).maybeSingle();
  if (error || !tu) return toast("Couldn't find your company account", true);
  tenantId = tu.tenant_id;
  $("tenantName").textContent = tu.tenants?.name || "";
  await Promise.all([loadPriceLevels(), loadItems(), loadCustomers()]);
  renderLevelSelects();
  renderCustomers();
  loadLevelPrices();
}

// ---------- DATA ----------
async function loadPriceLevels() {
  const { data } = await sb.from("price_levels")
    .select("id, name, rank")
    .eq("tenant_id", tenantId).eq("active", true)
    .order("rank");
  priceLevels = data || [];
}
async function loadItems() {
  const { data } = await sb.from("qbo_items")
    .select("id, name, sku, price")
    .eq("tenant_id", tenantId)
    .order("name");
  items = data || [];
}
async function loadCustomers() {
  const { data } = await sb.from("customers")
    .select("id, display_name, email, phone, primary_price_level_id, qbo_id")
    .eq("tenant_id", tenantId).eq("active", true)
    .order("display_name");
  customers = data || [];
}

// ---------- TABS ----------
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  $("panel-" + t.dataset.tab).classList.add("active");
});

// ---------- CUSTOMERS ----------
function renderLevelSelects() {
  const opts = priceLevels.map(l => `<option value="${l.id}">${l.name}</option>`).join("");
  $("custLevel").innerHTML = `<option value="">No price level (base prices)</option>` + opts;
  $("priceLevelSelect").innerHTML = opts;
}

function renderCustomers() {
  const q = $("custSearch").value.trim().toLowerCase();
  const list = customers.filter(c => !q || c.display_name.toLowerCase().includes(q));
  if (!list.length) { $("custList").innerHTML = `<div class="empty">No customers</div>`; return; }
  $("custList").innerHTML = list.map(c => {
    const opts = [`<option value="">Base</option>`]
      .concat(priceLevels.map(l =>
        `<option value="${l.id}" ${l.id === c.primary_price_level_id ? "selected" : ""}>Lvl ${l.rank}</option>`))
      .join("");
    return `<div class="row">
      <div class="info">
        <div class="name">${esc(c.display_name)}</div>
        <div class="meta">${c.qbo_id ? "QBO linked" : "Not in QBO yet"}${c.phone ? " · " + esc(c.phone) : ""}</div>
      </div>
      <select class="lvl" onchange="changeCustLevel('${c.id}', this.value)">${opts}</select>
    </div>`;
  }).join("");
}
$("custSearch").oninput = renderCustomers;

window.changeCustLevel = async (custId, levelId) => {
  const { error } = await sb.from("customers")
    .update({ primary_price_level_id: levelId || null })
    .eq("id", custId).eq("tenant_id", tenantId);
  if (error) return toast(error.message, true);
  const c = customers.find(x => x.id === custId);
  if (c) c.primary_price_level_id = levelId || null;
  toast("Price level updated");
};

$("addCustBtn").onclick = async () => {
  const name = $("custName").value.trim();
  if (!name) return toast("Name is required", true);
  $("addCustBtn").disabled = true;
  const { data, error } = await sb.from("customers").insert({
    tenant_id: tenantId,
    display_name: name,
    email: $("custEmail").value.trim() || null,
    phone: $("custPhone").value.trim() || null,
    address: $("custAddress").value.trim() || null,
    primary_price_level_id: $("custLevel").value || null,
    active: true
  }).select().single();
  $("addCustBtn").disabled = false;
  if (error) return toast(error.message, true);
  customers.push(data);
  customers.sort((a, b) => a.display_name.localeCompare(b.display_name));
  ["custName","custEmail","custPhone","custAddress"].forEach(id => $(id).value = "");
  $("custLevel").value = "";
  renderCustomers();
  toast(`${data.display_name} added`);
};

// ---------- PRICING ----------
$("priceLevelSelect").onchange = loadLevelPrices;
$("itemSearch").oninput = renderItems;

async function loadLevelPrices() {
  const levelId = $("priceLevelSelect").value;
  if (!levelId) return;
  const { data } = await sb.from("price_level_items")
    .select("id, item_id, override_value")
    .eq("tenant_id", tenantId).eq("price_level_id", levelId);
  levelPrices = {};
  (data || []).forEach(r => levelPrices[r.item_id] = { pliId: r.id, value: r.override_value });
  renderItems();
}

function renderItems() {
  const q = $("itemSearch").value.trim().toLowerCase();
  const list = items.filter(i => !q || i.name.toLowerCase().includes(q) || (i.sku || "").toLowerCase().includes(q));
  if (!list.length) { $("itemList").innerHTML = `<div class="empty">No items</div>`; return; }
  $("itemList").innerHTML = list.map(i => {
    const lp = levelPrices[i.id];
    const shown = lp ? money(lp.value) : money(i.price);
    const pillClass = lp ? "" : " base";
    return `<div class="row" id="row-${i.id}">
      <div class="info">
        <div class="name">${esc(i.name)}</div>
        <div class="meta">${esc(i.sku || "")} · base ${money(i.price)}</div>
      </div>
      <div class="price-pill${pillClass}" onclick="editPrice('${i.id}')">${shown}</div>
      <div class="price-edit">
        <input type="number" step="0.01" inputmode="decimal" id="inp-${i.id}" value="${lp ? lp.value : i.price}">
        <button class="save" onclick="savePrice('${i.id}')">Save</button>
        <button class="cancel" onclick="cancelEdit('${i.id}')">✕</button>
      </div>
    </div>`;
  }).join("");
}

window.editPrice = (itemId) => {
  document.querySelectorAll(".row.editing").forEach(r => r.classList.remove("editing"));
  $("row-" + itemId).classList.add("editing");
  const inp = $("inp-" + itemId);
  inp.focus(); inp.select();
};
window.cancelEdit = (itemId) => $("row-" + itemId).classList.remove("editing");

window.savePrice = async (itemId) => {
  const levelId = $("priceLevelSelect").value;
  const val = parseFloat($("inp-" + itemId).value);
  if (isNaN(val) || val < 0) return toast("Enter a valid price", true);
  const lp = levelPrices[itemId];
  let error;
  if (lp) {
    ({ error } = await sb.from("price_level_items")
      .update({ override_value: val, updated_at: new Date().toISOString() })
      .eq("id", lp.pliId).eq("tenant_id", tenantId));
    if (!error) lp.value = val;
  } else {
    const { data, error: e } = await sb.from("price_level_items").insert({
      tenant_id: tenantId,
      price_level_id: levelId,
      item_source: "qbo",
      item_id: itemId,
      override_mode: "custom",
      override_value: val
    }).select().single();
    error = e;
    if (!error) levelPrices[itemId] = { pliId: data.id, value: val };
  }
  if (error) return toast(error.message, true);
  renderItems();
  toast("Price saved — " + money(val));
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

init();
</script>
</body>
</html>
